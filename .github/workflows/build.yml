# Every push builds the device firmware and the desktop App and runs their tests. The packages are attached to the run
# (Actions › the run › Artifacts). A tag v* also makes a GitHub release with them.
#   firmware: deskhub-<version>-esp32s3.zip (USB package: images + flash.py)
#   App:      DeskHub-<version>.dmg and DeskHub-<version>.zip (Apple silicon; ad-hoc signed, not notarized)
name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # only used by the release step, on tags

jobs:
  firmware:
    runs-on: ubuntu-24.04
    container: espressif/idf:v6.0.2
    steps:
      - uses: actions/checkout@v4
      - name: Build the firmware (sdkconfig.defaults, nothing local)
        shell: bash
        run: |
          . "$IDF_PATH/export.sh"
          cd firmware
          idf.py -B build -DSDKCONFIG=build/sdkconfig build
      - name: Host tests (rules, protocol, view models)
        shell: bash
        run: |
          . "$IDF_PATH/export.sh"   # a job container does not run the image entrypoint: cmake comes from here
          cmake -S firmware/tests -B build-tests -G Ninja
          cmake --build build-tests --parallel
          ctest --test-dir build-tests --output-on-failure
      - name: Screen tests (the real UI code on native LVGL)
        shell: bash
        run: |
          . "$IDF_PATH/export.sh"   # a job container does not run the image entrypoint: cmake comes from here
          cmake -S firmware/tests/ui_preview -B build-preview -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build-preview --parallel
          ctest --test-dir build-preview --output-on-failure   # the UI checks and the touch-orientation regression
      - name: Package
        shell: bash
        run: |
          . "$IDF_PATH/export.sh"
          python scripts/package_firmware.py --build firmware/build
      - uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: dist/deskhub-*-esp32s3.zip
          if-no-files-found: error

  python:
    # The Agent route (docs/agent-setup.md), the USB tools and the protocol contracts. The console E2E run needs Chrome and
    # stays a manual step (docs/development.md).
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Environment (agent/uv.lock, as agent/README.md)
        run: |
          python -m pip install --quiet uv==0.5.31
          uv venv --python "$(command -v python)" .venv
          UV_PROJECT_ENVIRONMENT=../.venv uv sync --project agent --frozen --extra test
          uv pip install --python .venv/bin/python -r tools/requirements.txt
      - name: Agent tests
        run: .venv/bin/python -m pytest agent/tests -q
      - name: USB tool tests
        run: .venv/bin/python -m unittest discover -s tools/tests
      - name: Protocol contracts
        run: .venv/bin/python protocol/export_openapi.py --check
  desktop:
    runs-on: macos-15   # Apple silicon
    steps:
      - uses: actions/checkout@v4
      - name: Checks of the App's rules
        working-directory: desktop
        run: swift run core-check
      - name: DMG and ZIP
        run: desktop/scripts/make_release.sh
      - uses: actions/upload-artifact@v4
        with:
          name: desktop
          path: |
            desktop/build/DeskHub-*.dmg
            desktop/build/DeskHub-*.zip
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [firmware, python, desktop]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: packages
      - name: Release notes (versions and SHA-256 of every file)
        shell: bash
        run: |
          {
            echo "触摸屏固件：$(ls packages/firmware | sed -n 's/^deskhub-\(.*\)-esp32s3\.zip$/\1/p')"
            echo "桌面 App：$(ls packages/desktop | sed -n 's/^DeskHub-\(.*\)\.dmg$/\1/p')（Apple 芯片；ad-hoc 签名，没有公证：第一次打开在 Finder 里右键 → 打开）"
            echo
            echo "固件可以在 App 的 设置 → 固件 里用 USB 刷，或者用蓝牙升级；也可以解压后运行包里的 flash.py。"
            echo
            echo '```'
            (cd packages && sha256sum firmware/* desktop/*)
            echo '```'
          } > notes.md
          cat notes.md
      - uses: softprops/action-gh-release@v2
        with:
          body_path: notes.md
          files: |
            packages/firmware/*
            packages/desktop/*
