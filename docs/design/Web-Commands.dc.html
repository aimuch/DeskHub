<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>管理台 命令记录</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="{{vars}} display: flex; flex-wrap: wrap; min-height: 800px; background: radial-gradient(900px 520px at 88% -8%, var(--glow), transparent 62%), linear-gradient(160deg, var(--bg), var(--bg2)); color: var(--ink); font-family: 'Noto Sans SC', 'PingFang SC', sans-serif; font-size: 15px">

  <nav aria-label="主导航" style="flex: 0 0 224px; box-sizing: border-box; padding: 22px 14px; background: var(--side); border-right: 1px solid var(--edge)">
    <div style="display: flex; align-items: center; gap: 10px; padding: 0 8px 20px">
      <span style="width: 28px; height: 28px; border-radius: 50%; border: 4px solid var(--accent); box-sizing: border-box"></span>
      <span style="font-size: 20px; font-weight: 700">DeskHub</span>
    </div>
    <div style="display: flex; flex-direction: column; gap: 4px">
      <sc-for list="{{nav}}" as="n" hint-placeholder-count="8">
        <div style="height: 40px; box-sizing: border-box; padding: 0 12px; border-radius: 10px; display: flex; align-items: center; justify-content: space-between; font-size: 15px; font-weight: {{n.weight}}; background: {{n.bg}}; color: {{n.ink}}; box-shadow: {{n.glow}}"><span>{{n.label}}</span><span style="font-size: 13px">{{n.badge}}</span></div>
      </sc-for>
    </div>
  </nav>

  <main style="flex: 1 1 560px; min-width: 0; box-sizing: border-box; padding: 26px 32px; display: flex; flex-direction: column; gap: 18px">
    <header>
      <h1 style="margin: 0; font-size: 28px; font-weight: 700">命令记录</h1>
      <p style="margin: 4px 0 0; font-size: 14px; color: var(--muted)">“未确认”表示命令可能已经执行，但没有读回证据。Agent 不会自动重试。</p>
    </header>

    <div style="display: flex; flex-wrap: wrap; gap: 8px">
      <sc-for list="{{filters}}" as="f" hint-placeholder-count="4">
        <button style="font-family: inherit; font-size: 14px; font-weight: 500; min-height: 40px; padding: 0 16px; border-radius: 999px; background: {{f.bg}}; color: {{f.ink}}; border: {{f.border}}">{{f.label}}</button>
      </sc-for>
    </div>

    <div style="display: flex; flex-wrap: wrap; gap: 14px; align-items: flex-start">
      <section style="flex: 2 1 480px; min-width: 0; padding: 6px 18px 12px; border-radius: 16px; border: 1px solid var(--edge); background: var(--glass); backdrop-filter: blur(14px); box-shadow: var(--lift)">
        <div style="display: flex; flex-direction: column">
          <sc-for list="{{rows}}" as="r" hint-placeholder-count="6">
            <div style="display: flex; flex-wrap: wrap; align-items: center; gap: 10px; padding: 12px 8px; border-top: 1px solid var(--edge); border-radius: 8px; background: {{r.bg}}">
              <span style="flex: 0 0 74px; font-size: 13px; color: var(--muted)">{{r.time}}</span>
              <span style="flex: 1 1 130px; font-size: 15px; font-weight: 500">{{r.action}}</span>
              <span style="flex: 1 1 110px; font-size: 13px; color: var(--muted)">{{r.source}}</span>
              <span style="padding: 2px 10px; border-radius: 999px; font-size: 13px; font-weight: 500; color: {{r.c}}; background: {{r.cbg}}; border: 1px solid {{r.bd}}">{{r.text}}</span>
            </div>
          </sc-for>
        </div>
      </section>

      <aside aria-label="命令详情" style="flex: 1 1 300px; min-width: 0; padding: 18px; border-radius: 16px; border: 1px solid var(--edge); background: var(--glass); backdrop-filter: blur(14px); box-shadow: var(--lift)">
        <h2 style="margin: 0 0 4px; font-size: 16px; font-weight: 700">切到 PC</h2>
        <div style="font-size: 13px; color: var(--muted)">15:31:40 · 触屏</div>
        <div style="margin-top: 10px"><span style="padding: 2px 10px; border-radius: 999px; font-size: 13px; font-weight: 500; color: var(--power); background: color-mix(in srgb, var(--power) 15%, transparent); border: 1px solid color-mix(in srgb, var(--power) 50%, transparent)">未确认</span></div>
        <div style="margin-top: 14px; display: flex; flex-direction: column">
          <sc-for list="{{detail}}" as="d" hint-placeholder-count="5">
            <div style="display: flex; justify-content: space-between; gap: 12px; padding: 8px 0; border-top: 1px solid var(--edge); font-size: 14px"><span style="color: var(--muted)">{{d.k}}</span><span style="text-align: right; font-weight: 500">{{d.v}}</span></div>
          </sc-for>
        </div>
        <p style="margin: 12px 0 0; font-size: 13px; line-height: 1.6; color: var(--muted)">原因：控制通道在切换后消失，无法读回。如果需要，请在设备上再点一次，或用命令行重试。</p>
      </aside>
    </div>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"mode":{"editor":"enum","default":"dark","options":["dark","light"]},"$preview":{"width":1280,"height":800}}'>
class Component extends DCLogic {
  renderVals() {
    const T = {
      dark: '--bg2:#082520;--glow:rgba(94,230,184,0.10);--glass:rgba(11,29,26,0.72);--lift:0 10px 32px rgba(0,0,0,0.28), inset 0 1px 0 rgba(255,255,255,0.04);--bg:#040d0c;--side:#071713;--card:#0b1d1a;--edge:#1b3d37;--ink:#e6f7f2;--muted:#8aa8a1;--accent:#5ee6b8;--sel:#103a30;--wifi:#4fd1ff;--agent:#5be38c;--power:#f2b544;--time:#c38bff;--danger:#ff7b7b;',
      light: '--bg:#f3f8f6;--side:#ffffff;--card:#ffffff;--edge:#d3e2de;--ink:#10231f;--muted:#566e68;--accent:#0b7a5f;--sel:#dff3ec;--wifi:#086a96;--agent:#146b34;--power:#8f5a00;--time:#6a3aae;--danger:#b02e22;--bg2:#e4f1ec;--glow:rgba(11,122,95,0.08);--glass:rgba(255,255,255,0.82);--lift:0 8px 24px rgba(16,35,31,0.08);'
    };
    const K = (v) => ({ c: 'var(--' + v + ')', cbg: 'color-mix(in srgb, var(--' + v + ') 15%, transparent)', bd: 'color-mix(in srgb, var(--' + v + ') 50%, transparent)' });
    const names = ['概览', '设备', '动作与显示器', '命令记录', '布局与显示', '电源', '固件升级', '访问管理', '外观'];
    const active = 3;
    const filters = ['全部', '已确认', '未确认', '失败'];
    const rows = [
      { time: '15:48:02', action: '切到 Mac', source: '触屏', text: '已确认', k: 'agent' },
      { time: '15:31:40', action: '切到 PC', source: '触屏', text: '未确认', k: 'power', sel: true },
      { time: '14:05:12', action: '切到 PC 2', source: '快捷键', text: '失败', k: 'danger' },
      { time: '13:20:55', action: '切到 Mac', source: '命令行', text: '已确认', k: 'agent' },
      { time: '11:02:18', action: '切到 PC', source: '触屏', text: '已确认', k: 'agent' },
      { time: '09:40:03', action: '切到 Mac', source: '触屏', text: '已确认', k: 'agent' }
    ];
    return {
      vars: T[this.props.mode] || T.dark,
      nav: names.map((label, i) => ({
        label,
        badge: label === '设备' ? '1' : '',
        weight: i === active ? 500 : 400,
        bg: i === active ? 'var(--sel)' : 'transparent',
        glow: i === active ? 'inset 3px 0 0 var(--accent), 0 0 20px color-mix(in srgb, var(--accent) 22%, transparent)' : 'none',
        ink: i === active ? 'var(--accent)' : 'var(--muted)'
      })),
      filters: filters.map((label, i) => ({
        label,
        bg: i === 0 ? 'var(--sel)' : 'var(--card)',
        ink: i === 0 ? 'var(--accent)' : 'var(--ink)',
        border: i === 0 ? '1.5px solid var(--accent)' : '1px solid var(--edge)'
      })),
      rows: rows.map((r) => ({
        time: r.time, action: r.action, source: r.source, text: r.text,
        bg: r.sel ? 'var(--sel)' : 'transparent',
        ...K(r.k)
      })),
      detail: [
        { k: '命令编号', v: 'cmd-7f3a…91c2' },
        { k: '目标', v: '书桌显示器 → pc-dp' },
        { k: '读回输入源', v: '没有读回' },
        { k: '耗时', v: '5.0 秒（后端超时）' },
        { k: '原因码', v: 'CONTROL_PATH_LOST_AFTER_SWITCH' }
      ]
    };
  }
}
</script>
</body>
</html>
