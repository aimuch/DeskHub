<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>管理台 设备</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="{{vars}} display: flex; flex-wrap: wrap; min-height: 800px; background: radial-gradient(900px 520px at 88% -8%, var(--glow), transparent 62%), linear-gradient(160deg, var(--bg), var(--bg2)); color: var(--ink); font-family: 'Noto Sans SC', 'PingFang SC', sans-serif; font-size: 15px">

  <nav aria-label="主导航" style="flex: 0 0 224px; box-sizing: border-box; padding: 22px 14px; background: var(--side); border-right: 1px solid var(--edge)">
    <div style="display: flex; align-items: center; gap: 10px; padding: 0 8px 20px">
      <span style="width: 28px; height: 28px; border-radius: 50%; border: 4px solid var(--accent); box-sizing: border-box"></span>
      <span style="font-size: 20px; font-weight: 700">DeskHub</span>
    </div>
    <div style="display: flex; flex-direction: column; gap: 4px">
      <sc-for list="{{nav}}" as="n" hint-placeholder-count="8">
        <div style="height: 40px; box-sizing: border-box; padding: 0 12px; border-radius: 10px; display: flex; align-items: center; justify-content: space-between; font-size: 15px; font-weight: {{n.weight}}; background: {{n.bg}}; color: {{n.ink}}; box-shadow: {{n.glow}}"><span>{{n.label}}</span><span style="font-size: 13px">{{n.badge}}</span></div>
      </sc-for>
    </div>
  </nav>

  <main style="flex: 1 1 560px; min-width: 0; box-sizing: border-box; padding: 26px 32px; display: flex; flex-direction: column; gap: 18px">
    <header style="display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 12px">
      <div>
        <h1 style="margin: 0; font-size: 28px; font-weight: 700">设备</h1>
        <p style="margin: 4px 0 0; font-size: 14px; color: var(--muted)">“在线”表示最近 30 秒收到过有效上报。没有上报的项目显示“未上报”。</p>
      </div>
      <span style="font-size: 13px; color: var(--muted)">更新于 15:51:58</span>
    </header>

    <section style="display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 14px; padding: 18px; border-radius: 16px; border: 1px solid var(--edge); background: var(--glass); backdrop-filter: blur(14px); box-shadow: var(--lift)">
      <div style="display: flex; align-items: center; gap: 16px">
        <svg width="64" height="64" viewBox="0 0 72 72" role="img" aria-label="状态环：四项都正常" style="flex: none">
          <circle cx="36" cy="36" r="32.7" fill="none" stroke-width="7" style="stroke: var(--edge)"></circle>
          <g fill="none" stroke-linecap="round" stroke-width="7">
            <path d="M40.5 3.7 A32.7 32.7 0 0 1 68.3 31.5" style="stroke: var(--wifi)"></path>
            <path d="M68.3 40.5 A32.7 32.7 0 0 1 40.5 68.3" style="stroke: var(--agent)"></path>
            <path d="M31.5 68.3 A32.7 32.7 0 0 1 3.7 40.5" style="stroke: var(--power)"></path>
            <path d="M3.7 31.5 A32.7 32.7 0 0 1 31.5 3.7" style="stroke: var(--time)"></path>
          </g>
        </svg>
        <div>
          <div style="font-size: 20px; font-weight: 700">desk-01</div>
          <div style="margin-top: 2px; font-size: 13px; color: var(--muted)">deskhub-44bd8d60c598 · ESP32-S3-Touch-AMOLED-2.16</div>
          <div style="margin-top: 8px; display: flex; flex-wrap: wrap; gap: 6px">
            <sc-for list="{{chips}}" as="c" hint-placeholder-count="3">
              <span style="padding: 2px 10px; border-radius: 999px; font-size: 13px; font-weight: 500; color: {{c.c}}; background: {{c.bg}}; border: 1px solid {{c.bd}}">{{c.text}}</span>
            </sc-for>
          </div>
        </div>
      </div>
      <div style="display: flex; flex-wrap: wrap; gap: 8px">
        <button style="font-family: inherit; font-size: 14px; font-weight: 500; min-height: 44px; padding: 0 16px; border-radius: 12px; border: 1px solid var(--edge); background: var(--glass); backdrop-filter: blur(14px); box-shadow: var(--lift); color: var(--ink)">重启设备</button>
        <button style="font-family: inherit; font-size: 14px; font-weight: 500; min-height: 44px; padding: 0 16px; border-radius: 12px; border: 1px solid color-mix(in srgb, var(--danger) 55%, transparent); background: color-mix(in srgb, var(--danger) 12%, transparent); color: var(--danger)">恢复出厂…</button>
      </div>
    </section>

    <div style="display: flex; flex-wrap: wrap; gap: 14px; align-items: flex-start">
      <section style="flex: 1 1 400px; min-width: 0; padding: 18px; border-radius: 16px; border: 1px solid var(--edge); background: var(--glass); backdrop-filter: blur(14px); box-shadow: var(--lift)">
        <h2 style="margin: 0 0 8px; font-size: 16px; font-weight: 700">设备状态</h2>
        <div style="display: flex; flex-direction: column">
          <sc-for list="{{facts}}" as="f" hint-placeholder-count="8">
            <div style="display: flex; justify-content: space-between; gap: 12px; padding: 9px 0; border-top: 1px solid var(--edge)"><span style="font-size: 14px; color: var(--muted)">{{f.k}}</span><span style="font-size: 14px; font-weight: 500; text-align: right; color: {{f.c}}">{{f.v}}</span></div>
          </sc-for>
        </div>
      </section>

      <div style="flex: 1 1 340px; min-width: 0; display: flex; flex-direction: column; gap: 14px">
        <section style="padding: 18px; border-radius: 16px; border: 1px solid var(--edge); background: var(--glass); backdrop-filter: blur(14px); box-shadow: var(--lift)">
          <h2 style="margin: 0 0 12px; font-size: 16px; font-weight: 700">配置状态</h2>
          <ol style="list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 12px">
            <sc-for list="{{steps}}" as="s" hint-placeholder-count="3">
              <li style="display: flex; gap: 12px; align-items: flex-start">
                <span style="flex: none; width: 22px; height: 22px; margin-top: 1px; border-radius: 50%; box-sizing: border-box; border: 2px solid {{s.color}}; background: {{s.fill}}"></span>
                <div><div style="font-size: 14px; font-weight: 500">{{s.title}}</div><div style="margin-top: 1px; font-size: 13px; color: var(--muted)">{{s.note}}</div></div>
              </li>
            </sc-for>
          </ol>
        </section>
        <section style="padding: 18px; border-radius: 16px; border: 1px solid var(--edge); background: var(--glass); backdrop-filter: blur(14px); box-shadow: var(--lift)">
          <h2 style="margin: 0 0 8px; font-size: 16px; font-weight: 700">升级信任</h2>
          <div style="font-size: 13px; color: var(--muted)">三处签名公钥指纹必须一致：</div>
          <div style="margin-top: 8px; display: flex; flex-direction: column; gap: 6px; font-size: 13px">
            <div style="display: flex; justify-content: space-between; gap: 10px"><span style="color: var(--muted)">Agent</span><span style="font-family: ui-monospace, monospace">7b5b1006…294a</span></div>
            <div style="display: flex; justify-content: space-between; gap: 10px"><span style="color: var(--muted)">固件包</span><span style="font-family: ui-monospace, monospace">7b5b1006…294a</span></div>
            <div style="display: flex; justify-content: space-between; gap: 10px"><span style="color: var(--muted)">设备</span><span style="font-family: ui-monospace, monospace">7b5b1006…294a</span></div>
          </div>
        </section>
      </div>
    </div>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"mode":{"editor":"enum","default":"dark","options":["dark","light"]},"$preview":{"width":1280,"height":800}}'>
class Component extends DCLogic {
  renderVals() {
    const T = {
      dark: '--bg2:#082520;--glow:rgba(94,230,184,0.10);--glass:rgba(11,29,26,0.72);--lift:0 10px 32px rgba(0,0,0,0.28), inset 0 1px 0 rgba(255,255,255,0.04);--bg:#040d0c;--side:#071713;--card:#0b1d1a;--edge:#1b3d37;--ink:#e6f7f2;--muted:#8aa8a1;--accent:#5ee6b8;--sel:#103a30;--wifi:#4fd1ff;--agent:#5be38c;--power:#f2b544;--time:#c38bff;--danger:#ff7b7b;',
      light: '--bg:#f3f8f6;--side:#ffffff;--card:#ffffff;--edge:#d3e2de;--ink:#10231f;--muted:#566e68;--accent:#0b7a5f;--sel:#dff3ec;--wifi:#086a96;--agent:#146b34;--power:#8f5a00;--time:#6a3aae;--danger:#b02e22;--bg2:#e4f1ec;--glow:rgba(11,122,95,0.08);--glass:rgba(255,255,255,0.82);--lift:0 8px 24px rgba(16,35,31,0.08);'
    };
    const K = (v) => ({ c: 'var(--' + v + ')', bg: 'color-mix(in srgb, var(--' + v + ') 15%, transparent)', bd: 'color-mix(in srgb, var(--' + v + ') 50%, transparent)' });
    const names = ['概览', '设备', '动作与显示器', '命令记录', '布局与显示', '电源', '固件升级', '访问管理', '外观'];
    const active = 1;
    return {
      vars: T[this.props.mode] || T.dark,
      nav: names.map((label, i) => ({
        label,
        badge: label === '设备' ? '1' : '',
        weight: i === active ? 500 : 400,
        bg: i === active ? 'var(--sel)' : 'transparent',
        glow: i === active ? 'inset 3px 0 0 var(--accent), 0 0 20px color-mix(in srgb, var(--accent) 22%, transparent)' : 'none',
        ink: i === active ? 'var(--accent)' : 'var(--muted)'
      })),
      chips: [
        { text: '在线', ...K('agent') },
        { text: '配置待确认', ...K('power') },
        { text: '固件 0.2.6', ...K('muted') }
      ],
      facts: [
        { k: '运行时间', v: '3 天 4 小时', c: 'var(--ink)' },
        { k: '可用堆内存', v: '176 KiB', c: 'var(--ink)' },
        { k: 'USB', v: '已接入', c: 'var(--agent)' },
        { k: '电池', v: '已安装', c: 'var(--ink)' },
        { k: '充电状态', v: '充电中', c: 'var(--agent)' },
        { k: '电量', v: '67%（PMIC 估算，未验证）', c: 'var(--ink)' },
        { k: '电池电压 / USB 电压', v: '4.12 V / 5.03 V', c: 'var(--ink)' },
        { k: '芯片温度', v: '42.0 °C', c: 'var(--ink)' }
      ],
      steps: [
        { title: 'Agent 已保存 revision 35', note: '15:50:12', color: 'var(--agent)', fill: 'var(--agent)' },
        { title: '等待设备确认', note: '设备要先校验、保存，并重绘界面，才会上报确认', color: 'var(--power)', fill: 'transparent' },
        { title: '设备已应用', note: '设备上报的 revision 与完整配置一致后才显示', color: 'var(--edge)', fill: 'transparent' }
      ]
    };
  }
}
</script>
</body>
</html>
