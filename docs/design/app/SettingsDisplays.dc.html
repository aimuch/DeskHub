<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>设置 显示器</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:inherit;text-decoration:none}
</style>
</helmet>
<div style="width: 760px; height: 520px; box-sizing: border-box; display: flex; border-radius: 12px; overflow: hidden; background: #1e2024; box-shadow: inset 0 0 0 1px #34383e; font-family: -apple-system, 'PingFang SC', 'Noto Sans SC', sans-serif; color: #f2f4f6">
  <nav aria-label="设置分类" style="width: 180px; flex: none; box-sizing: border-box; padding: 44px 10px 10px; background: #17191c; display: flex; flex-direction: column; gap: 2px; box-shadow: inset -1px 0 0 #2a2e33">
    <a href="SettingsDisplays.dc.html" aria-current="page" style="height: 30px; padding: 0 10px; border-radius: 6px; display: flex; align-items: center; font-size: 13px; background: {{accentSoft}}; color: {{accent}}">显示器</a>
    <a href="SettingsInputs.dc.html" style="height: 30px; padding: 0 10px; border-radius: 6px; display: flex; align-items: center; font-size: 13px">输入源</a>
    <a href="SettingsDevice.dc.html" style="height: 30px; padding: 0 10px; border-radius: 6px; display: flex; align-items: center; font-size: 13px">触摸屏</a>
    <a href="SettingsDisplays.dc.html" style="height: 30px; padding: 0 10px; border-radius: 6px; display: flex; align-items: center; font-size: 13px">通用</a>
  </nav>
  <main style="flex: 1; min-width: 0; box-sizing: border-box; padding: 28px 28px 20px; display: flex; flex-direction: column; gap: 14px">
    <div>
      <div style="font-size: 20px; font-weight: 600">显示器</div>
      <div style="margin-top: 4px; font-size: 12px; color: #a2abb3">只切绑定的显示器。绑定按三样东西认它：UUID、序列号、IO 位置（规则 K2）。三样都对上才发命令。</div>
    </div>

    <div style="border-radius: 10px; background: #26292e; box-shadow: inset 0 0 0 1.5px {{accentLine}}; padding: 14px 16px; display: flex; flex-direction: column; gap: 10px">
      <div style="display: flex; align-items: center; gap: 12px">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="{{accent}}" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4.5" width="18" height="12" rx="2"></rect><path d="M12 16.5v4M8.5 20.5h7"></path></svg>
        <div style="flex: 1; display: flex; flex-direction: column">
          <span style="font-size: 14px; font-weight: 600">DELL U2720QM</span>
          <span style="font-size: 12px; color: #59f0a6">已绑定 · DDC 有回应</span>
        </div>
        <button type="button" style="all: unset; height: 28px; padding: 0 12px; border-radius: 6px; font-size: 12px; box-shadow: inset 0 0 0 1px #3d4248">解除绑定</button>
      </div>
      <dl style="margin: 0; display: grid; grid-template-columns: 80px minmax(0, 1fr); row-gap: 4px; font-size: 12px">
        <dt style="color: #8a939b">UUID</dt><dd style="margin: 0; font-family: ui-monospace, Menlo, monospace; color: #c4cbd2">[显示器的系统 UUID]</dd>
        <dt style="color: #8a939b">序列号</dt><dd style="margin: 0; font-family: ui-monospace, Menlo, monospace; color: #c4cbd2">[EDID 序列号]</dd>
        <dt style="color: #8a939b">IO 位置</dt><dd style="margin: 0; font-family: ui-monospace, Menlo, monospace; color: #c4cbd2">[IORegistry 位置]</dd>
      </dl>
    </div>

    <div style="font-size: 12px; color: #8a939b">这台 Mac 上的其他显示器</div>
    <div style="border-radius: 10px; background: #26292e; padding: 12px 16px; display: flex; align-items: center; gap: 12px">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#c4cbd2" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4.5" width="18" height="12" rx="2"></rect><path d="M12 16.5v4M8.5 20.5h7"></path></svg>
      <div style="flex: 1; display: flex; flex-direction: column">
        <span style="font-size: 13px">DELL U2719DS</span>
        <span style="font-size: 12px; color: #a2abb3">没有绑定 · DDC 有回应</span>
      </div>
      <button type="button" style="all: unset; height: 28px; padding: 0 12px; border-radius: 6px; font-size: 12px; font-weight: 500; color: #0b0d10; background: {{accent}}">绑定</button>
    </div>
    <div style="font-size: 12px; line-height: 1.6; color: #8a939b">只支持 Apple 芯片的 Mac。内建屏和不回应 DDC 的显示器不列出来。</div>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#2fd8ff","options":["#2fd8ff","#5ee6b8","#ff9e4a"]},"$preview":{"width":760,"height":520}}'>
class Component extends DCLogic {
  renderVals() {
    const a = this.props.accent ?? '#2fd8ff';
    const rgb = [1, 3, 5].map((i) => parseInt(a.slice(i, i + 2), 16)).join(',');
    return { accent: a, accentSoft: 'rgba(' + rgb + ',0.14)', accentLine: 'rgba(' + rgb + ',0.55)' };
  }
}
</script>
</body>
</html>
