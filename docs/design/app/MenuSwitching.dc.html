<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>菜单 正在切换</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:inherit;text-decoration:none}
</style>
</helmet>
<div style="width: 340px; height: 520px; box-sizing: border-box; padding: 10px; display: flex; flex-direction: column; gap: 12px; background: #0b0d10; font-family: -apple-system, 'PingFang SC', 'Noto Sans SC', sans-serif; color: #f2f4f6">

  <div style="box-sizing: border-box; border-radius: 12px; background: #1e2024; box-shadow: 0 0 0 1px #34383e; padding: 6px 0 10px; display: flex; flex-direction: column">
    <div style="padding: 10px 14px 8px; font-size: 12px; color: #a2abb3">正在切换（别的输入源先变暗，不能再点）</div>
    <div style="padding: 0 6px; display: flex; flex-direction: column; gap: 2px">
      <div style="height: 48px; box-sizing: border-box; padding: 0 10px; border-radius: 8px; display: flex; align-items: center; gap: 12px; opacity: 0.4">
        <span style="width: 26px; height: 26px; border-radius: 6px; box-shadow: inset 0 0 0 1.5px #c4cbd2"></span>
        <span style="flex: 1; font-size: 14px">Mac mini</span>
      </div>
      <div role="status" style="height: 48px; box-sizing: border-box; padding: 0 10px; border-radius: 8px; display: flex; align-items: center; gap: 12px; background: {{accentSoft}}">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="{{accent}}" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 3a9 9 0 1 0 9 9"></path></svg>
        <span style="flex: 1; display: flex; flex-direction: column">
          <span style="font-size: 14px; font-weight: 500">MacBook M1</span>
          <span style="font-size: 11px; color: {{accent}}">正在切换…</span>
        </span>
      </div>
      <div style="height: 48px; box-sizing: border-box; padding: 0 10px; border-radius: 8px; display: flex; align-items: center; gap: 12px; opacity: 0.4">
        <span style="width: 26px; height: 26px; border-radius: 6px; box-shadow: inset 0 0 0 1.5px #c4cbd2"></span>
        <span style="flex: 1; font-size: 14px">MacBook M4</span>
      </div>
    </div>
  </div>

  <div style="box-sizing: border-box; border-radius: 12px; background: #1e2024; box-shadow: 0 0 0 1px #34383e; padding: 14px; display: flex; flex-direction: column; gap: 10px">
    <div style="font-size: 12px; color: #a2abb3">结果有三种（规则 K3）</div>
    <div style="display: flex; gap: 10px; align-items: flex-start">
      <span style="margin-top: 5px; width: 8px; height: 8px; border-radius: 4px; background: #59f0a6; flex: none"></span>
      <span style="font-size: 13px; line-height: 1.5"><span style="color: #59f0a6">已确认</span>：显示器读回的输入就是目标。</span>
    </div>
    <div style="display: flex; gap: 10px; align-items: flex-start">
      <span style="margin-top: 5px; width: 8px; height: 8px; border-radius: 4px; background: #ffb547; flex: none"></span>
      <span style="font-size: 13px; line-height: 1.5"><span style="color: #ffb547">已发送（未确认）</span>：命令发出去了，但读不回，或读回的不一致。不自动重试。</span>
    </div>
    <div style="display: flex; gap: 10px; align-items: flex-start">
      <span style="margin-top: 5px; width: 8px; height: 8px; border-radius: 4px; background: #ff7b7b; flex: none"></span>
      <span style="font-size: 13px; line-height: 1.5"><span style="color: #ff7b7b">没有发出</span>：DDC 写失败，写明原因。</span>
    </div>
    <div style="height: 1px; background: #34383e"></div>
    <div style="font-size: 12px; line-height: 1.6; color: #a2abb3">切到别的电脑以后，这台 Mac 的画面就没了。要切回来，用菜单栏、触摸屏或显示器按键。这台显示器实测能从 Mac mini 切回来（实验 E1）。</div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#2fd8ff","options":["#2fd8ff","#5ee6b8","#ff9e4a"]},"$preview":{"width":340,"height":520}}'>
class Component extends DCLogic {
  renderVals() {
    const a = this.props.accent ?? '#2fd8ff';
    const rgb = [1, 3, 5].map((i) => parseInt(a.slice(i, i + 2), 16)).join(',');
    return { accent: a, accentSoft: 'rgba(' + rgb + ',0.14)' };
  }
}
</script>
</body>
</html>
