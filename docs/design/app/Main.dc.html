<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>菜单 平时</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:inherit;text-decoration:none}
</style>
</helmet>
<div style="width: 340px; height: 520px; box-sizing: border-box; padding: 10px; background: #0b0d10; font-family: -apple-system, 'PingFang SC', 'Noto Sans SC', sans-serif; color: #f2f4f6">
  <div style="height: 100%; box-sizing: border-box; border-radius: 12px; background: #1e2024; box-shadow: 0 0 0 1px #34383e, 0 12px 32px rgba(0,0,0,0.5); padding: 6px 0; display: flex; flex-direction: column">

    <div style="padding: 10px 14px 8px; display: flex; align-items: center; gap: 10px">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="{{accent}}" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4.5" width="18" height="12" rx="2"></rect><path d="M12 16.5v4M8.5 20.5h7"></path></svg>
      <div style="flex: 1; display: flex; flex-direction: column">
        <span style="font-size: 14px; font-weight: 600">DELL U2720QM</span>
        <span style="font-size: 12px; color: #a2abb3">已绑定 · DDC 可用</span>
      </div>
    </div>

    <div style="padding: 0 6px; display: flex; flex-direction: column; gap: 2px">
      <a href="MenuSwitching.dc.html" aria-current="true" style="height: 52px; box-sizing: border-box; padding: 0 10px; border-radius: 8px; display: flex; align-items: center; gap: 12px; background: {{accentSoft}}">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="{{accent}}" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="9" width="17" height="7" rx="2.5"></rect><path d="M8 19h8"></path></svg>
        <span style="flex: 1; display: flex; flex-direction: column">
          <span style="font-size: 14px; font-weight: 500">Mac mini</span>
          <span style="font-size: 11px; color: #a2abb3">DisplayPort · 这台 Mac</span>
        </span>
        <span style="font-size: 11px; font-weight: 600; color: #0b0d10; background: {{accent}}; border-radius: 9px; padding: 2px 8px">当前</span>
      </a>
      <a href="MenuSwitching.dc.html" style="height: 52px; box-sizing: border-box; padding: 0 10px; border-radius: 8px; display: flex; align-items: center; gap: 12px">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#c4cbd2" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="5.5" width="14" height="9.5" rx="1.5"></rect><path d="M2.5 18.5h19"></path></svg>
        <span style="flex: 1; display: flex; flex-direction: column">
          <span style="font-size: 14px; font-weight: 500">MacBook M1</span>
          <span style="font-size: 11px; color: #a2abb3">HDMI</span>
        </span>
      </a>
      <a href="MenuSwitching.dc.html" style="height: 52px; box-sizing: border-box; padding: 0 10px; border-radius: 8px; display: flex; align-items: center; gap: 12px">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#c4cbd2" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="5.5" width="14" height="9.5" rx="1.5"></rect><path d="M2.5 18.5h19"></path></svg>
        <span style="flex: 1; display: flex; flex-direction: column">
          <span style="font-size: 14px; font-weight: 500">MacBook M4</span>
          <span style="font-size: 11px; color: #a2abb3">USB-C</span>
        </span>
      </a>
    </div>

    <div style="margin: 8px 14px 0; font-size: 12px; color: #a2abb3; line-height: 1.5">上次：切到 Mac mini · <span style="color: #59f0a6">已确认</span> · 2 分钟前</div>

    <div style="height: 1px; background: #34383e; margin: 10px 0"></div>

    <div style="padding: 0 14px; display: flex; align-items: center; gap: 10px">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#a2abb3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 7l10 10-5 5V2l5 5L7 17"></path></svg>
      <span style="flex: 1; font-size: 13px">触摸屏</span>
      <span style="font-size: 12px; color: #a2abb3">还没有配对</span>
    </div>

    <div style="height: 1px; background: #34383e; margin: 10px 0"></div>

    <div style="padding: 0 6px; display: flex; flex-direction: column">
      <a href="SettingsDisplays.dc.html" style="height: 30px; padding: 0 8px; border-radius: 6px; display: flex; align-items: center; font-size: 13px">设置…<span style="margin-left: auto; color: #8a939b">⌘,</span></a>
      <button type="button" aria-pressed="true" style="all: unset; height: 30px; padding: 0 8px; border-radius: 6px; display: flex; align-items: center; gap: 6px; font-size: 13px"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#f2f4f6" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5 9-10"></path></svg>开机时启动</button>
      <button type="button" style="all: unset; height: 30px; padding: 0 8px; border-radius: 6px; display: flex; align-items: center; font-size: 13px">退出 DeskHub<span style="margin-left: auto; color: #8a939b">⌘Q</span></button>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#2fd8ff","options":["#2fd8ff","#5ee6b8","#ff9e4a"]},"$preview":{"width":340,"height":520}}'>
class Component extends DCLogic {
  renderVals() {
    const a = this.props.accent ?? '#2fd8ff';
    const rgb = [1, 3, 5].map((i) => parseInt(a.slice(i, i + 2), 16)).join(',');
    return { accent: a, accentSoft: 'rgba(' + rgb + ',0.14)' };
  }
}
</script>
</body>
</html>
