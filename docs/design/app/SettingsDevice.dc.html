<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>设置 触摸屏</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:inherit;text-decoration:none}
</style>
</helmet>
<div style="width: 760px; height: 520px; box-sizing: border-box; display: flex; border-radius: 12px; overflow: hidden; background: #1e2024; box-shadow: inset 0 0 0 1px #34383e; font-family: -apple-system, 'PingFang SC', 'Noto Sans SC', sans-serif; color: #f2f4f6">
  <nav aria-label="设置分类" style="width: 180px; flex: none; box-sizing: border-box; padding: 44px 10px 10px; background: #17191c; display: flex; flex-direction: column; gap: 2px; box-shadow: inset -1px 0 0 #2a2e33">
    <a href="SettingsDisplays.dc.html" style="height: 30px; padding: 0 10px; border-radius: 6px; display: flex; align-items: center; font-size: 13px">显示器</a>
    <a href="SettingsInputs.dc.html" style="height: 30px; padding: 0 10px; border-radius: 6px; display: flex; align-items: center; font-size: 13px">输入源</a>
    <a href="SettingsDevice.dc.html" aria-current="page" style="height: 30px; padding: 0 10px; border-radius: 6px; display: flex; align-items: center; font-size: 13px; background: {{accentSoft}}; color: {{accent}}">触摸屏</a>
    <a href="SettingsDisplays.dc.html" style="height: 30px; padding: 0 10px; border-radius: 6px; display: flex; align-items: center; font-size: 13px">通用</a>
  </nav>
  <main style="flex: 1; min-width: 0; box-sizing: border-box; padding: 28px 28px 20px; display: flex; flex-direction: column; gap: 14px">
    <div>
      <div style="font-size: 20px; font-weight: 600">触摸屏</div>
      <div style="margin-top: 4px; font-size: 12px; color: #a2abb3">触摸屏通过蓝牙连这台 Mac。在触摸屏上点输入源，由这个 App 切。</div>
    </div>

    <div style="border-radius: 10px; background: #26292e; padding: 14px 16px; display: flex; align-items: center; gap: 12px">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#a2abb3" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 7l10 10-5 5V2l5 5L7 17"></path></svg>
      <div style="flex: 1; display: flex; flex-direction: column">
        <span style="font-size: 14px; font-weight: 600">还没有配对</span>
        <span style="font-size: 12px; color: #a2abb3">触摸屏的蓝牙固件还在做。做好以后在这里配对。</span>
      </div>
      <button type="button" disabled style="all: unset; height: 28px; padding: 0 12px; border-radius: 6px; font-size: 12px; color: #6b737a; box-shadow: inset 0 0 0 1px #33373c">配对…</button>
    </div>

    <div style="font-size: 12px; color: #8a939b">以后的配对步骤</div>
    <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px">
      <div style="border-radius: 10px; background: #26292e; padding: 12px; display: flex; flex-direction: column; gap: 6px">
        <span style="font-size: 12px; color: {{accent}}">1</span>
        <span style="font-size: 13px; line-height: 1.5">在触摸屏上打开“设置 → 连接与配对 → 配对电脑”。2 分钟内有效。</span>
      </div>
      <div style="border-radius: 10px; background: #26292e; padding: 12px; display: flex; flex-direction: column; gap: 6px">
        <span style="font-size: 12px; color: {{accent}}">2</span>
        <span style="font-size: 13px; line-height: 1.5">点这里的“配对…”。两边各显示 6 位数字。</span>
        <span style="font-family: ui-monospace, Menlo, monospace; font-size: 22px; letter-spacing: 3px; color: {{accent}}">520 617</span>
      </div>
      <div style="border-radius: 10px; background: #26292e; padding: 12px; display: flex; flex-direction: column; gap: 6px">
        <span style="font-size: 12px; color: {{accent}}">3</span>
        <span style="font-size: 13px; line-height: 1.5">数字一样，30 秒内两边都点确认。之后自动连接，不用再配。</span>
      </div>
    </div>

    <div style="border-radius: 10px; background: #26292e; padding: 12px 16px; display: flex; align-items: center; gap: 12px">
      <span style="flex: 1; font-size: 13px">连电脑的方式</span>
      <span style="font-size: 12px; color: #a2abb3">蓝牙（默认）· Wi-Fi 以后在触摸屏上选</span>
    </div>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#2fd8ff","options":["#2fd8ff","#5ee6b8","#ff9e4a"]},"$preview":{"width":760,"height":520}}'>
class Component extends DCLogic {
  renderVals() {
    const a = this.props.accent ?? '#2fd8ff';
    const rgb = [1, 3, 5].map((i) => parseInt(a.slice(i, i + 2), 16)).join(',');
    return { accent: a, accentSoft: 'rgba(' + rgb + ',0.14)' };
  }
}
</script>
</body>
</html>
