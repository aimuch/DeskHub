<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>设置 固件 刷入中</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:inherit;text-decoration:none}
</style>
</helmet>
<div style="width: 760px; height: 520px; box-sizing: border-box; display: flex; border-radius: 12px; overflow: hidden; background: #1e2024; box-shadow: inset 0 0 0 1px #34383e; font-family: -apple-system, 'PingFang SC', 'Noto Sans SC', sans-serif; color: #f2f4f6">
  <nav aria-label="设置分类" style="width: 180px; flex: none; box-sizing: border-box; padding: 44px 10px 10px; background: #17191c; display: flex; flex-direction: column; gap: 2px; box-shadow: inset -1px 0 0 #2a2e33">
    <a href="SettingsDisplays.dc.html" style="height: 30px; padding: 0 10px; border-radius: 6px; display: flex; align-items: center; font-size: 13px">显示器</a>
    <a href="SettingsInputs.dc.html" style="height: 30px; padding: 0 10px; border-radius: 6px; display: flex; align-items: center; font-size: 13px">输入源</a>
    <a href="SettingsDevice.dc.html" style="height: 30px; padding: 0 10px; border-radius: 6px; display: flex; align-items: center; font-size: 13px">触摸屏</a>
    <a href="SettingsFirmware.dc.html" aria-current="page" style="height: 30px; padding: 0 10px; border-radius: 6px; display: flex; align-items: center; font-size: 13px; background: {{accentSoft}}; color: {{accent}}">固件</a>
    <a href="SettingsDisplays.dc.html" style="height: 30px; padding: 0 10px; border-radius: 6px; display: flex; align-items: center; font-size: 13px">通用</a>
  </nav>
  <main style="flex: 1; min-width: 0; box-sizing: border-box; padding: 28px 28px 20px; display: flex; flex-direction: column; gap: 14px">
    <div>
      <div style="font-size: 20px; font-weight: 600">固件</div>
      <div style="margin-top: 4px; font-size: 12px; color: #a2abb3">用 USB 线给触摸屏刷固件。设置会保留。刷完从 USB 读回版本，一样才算刷好。</div>
    </div>
    <div style="border-radius: 10px; background: #26292e; padding: 14px 16px; display: flex; align-items: center; gap: 12px; flex-direction: column; align-items: stretch">
      <div style="display: flex; justify-content: space-between; font-size: 14px; font-weight: 600"><span>正在写入 deskhub.bin</span><span style="color: {{accent}}">62%</span></div>
      <div style="height: 6px; border-radius: 3px; background: #1a1d21; overflow: hidden"><div style="width: 62%; height: 100%; background: {{accent}}"></div></div>
      <span style="font-size: 12px; color: #a2abb3">已确认 ESP32-S3、16 MB。写完 esptool 会核对每个镜像，然后设备重启。</span>
    </div>
    <div style="border-radius: 10px; background: #26292e; padding: 14px 16px; display: flex; align-items: center; gap: 12px">
      <div style="flex: 1; display: flex; flex-direction: column; gap: 2px">
        <span style="font-size: 14px; font-weight: 600">已刷入 0.3.21（读回确认）</span>
        <span style="font-size: 12px; color: #5ee6b8">设备重启后从 USB 读到 0.3.21，编号 deskhub-44bd8d60c598 没变</span>
      </div>
      <span style="font-size: 20px; color: #5ee6b8">✓</span>
    </div>
    <div style="border-radius: 10px; background: #26292e; padding: 14px 16px; display: flex; align-items: center; gap: 12px">
      <div style="flex: 1; display: flex; flex-direction: column; gap: 2px">
        <span style="font-size: 14px; font-weight: 600">没刷完</span>
        <span style="font-size: 12px; color: #ff9e4a">写到一半断开了。设备可能起不来：按住 BOOT 再插线，进下载模式后再刷。</span>
      </div>
      <button type="button" style="all: unset; height: 28px; padding: 0 12px; border-radius: 6px; font-size: 12px; box-shadow: inset 0 0 0 1px #3a3f45">再刷一次</button>
    </div>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#2fd8ff","options":["#2fd8ff","#5ee6b8","#ff9e4a"]},"$preview":{"width":760,"height":520}}'>
class Component extends DCLogic {
  renderVals() {
    const a = this.props.accent ?? '#2fd8ff';
    const rgb = [1, 3, 5].map((i) => parseInt(a.slice(i, i + 2), 16)).join(',');
    return { accent: a, accentSoft: 'rgba(' + rgb + ',0.14)' };
  }
}
</script>
</body>
</html>
