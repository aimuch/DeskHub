<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>管理台 动作与显示器</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="{{vars}} display: flex; flex-wrap: wrap; min-height: 800px; background: radial-gradient(900px 520px at 88% -8%, var(--glow), transparent 62%), linear-gradient(160deg, var(--bg), var(--bg2)); color: var(--ink); font-family: 'Noto Sans SC', 'PingFang SC', sans-serif; font-size: 15px">

  <nav aria-label="主导航" style="flex: 0 0 224px; box-sizing: border-box; padding: 22px 14px; background: var(--side); border-right: 1px solid var(--edge)">
    <div style="display: flex; align-items: center; gap: 10px; padding: 0 8px 20px">
      <span style="width: 28px; height: 28px; border-radius: 50%; border: 4px solid var(--accent); box-sizing: border-box"></span>
      <span style="font-size: 20px; font-weight: 700">DeskHub</span>
    </div>
    <div style="display: flex; flex-direction: column; gap: 4px">
      <sc-for list="{{nav}}" as="n" hint-placeholder-count="8">
        <div style="height: 40px; box-sizing: border-box; padding: 0 12px; border-radius: 10px; display: flex; align-items: center; justify-content: space-between; font-size: 15px; font-weight: {{n.weight}}; background: {{n.bg}}; color: {{n.ink}}; box-shadow: {{n.glow}}"><span>{{n.label}}</span><span style="font-size: 13px">{{n.badge}}</span></div>
      </sc-for>
    </div>
  </nav>

  <main style="flex: 1 1 560px; min-width: 0; box-sizing: border-box; padding: 26px 32px; display: flex; flex-direction: column; gap: 18px">
    <header>
      <h1 style="margin: 0; font-size: 28px; font-weight: 700">动作与显示器</h1>
      <p style="margin: 4px 0 0; font-size: 14px; color: var(--muted)">这一页只读。显示器绑定标识（UUID、序列号、注册路径）不会显示。</p>
    </header>

    <section style="display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; padding: 18px; border-radius: 16px; border: 1px solid var(--edge); background: var(--glass); backdrop-filter: blur(14px); box-shadow: var(--lift)">
      <div>
        <h2 style="margin: 0; font-size: 16px; font-weight: 700">显示器后端 · BetterDisplay</h2>
        <p style="margin: 4px 0 0; font-size: 13px; line-height: 1.6; color: var(--muted)">后端不可用时，触屏和命令行的显示器动作会返回“不可用”，不会产生假成功。</p>
      </div>
      <span style="padding: 2px 12px; border-radius: 999px; font-size: 13px; font-weight: 500; color: var(--agent); background: color-mix(in srgb, var(--agent) 15%, transparent); border: 1px solid color-mix(in srgb, var(--agent) 50%, transparent)">后端可用</span>
    </section>

    <section style="padding: 18px; border-radius: 16px; border: 1px solid var(--edge); background: var(--glass); backdrop-filter: blur(14px); box-shadow: var(--lift)">
      <div style="display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 10px">
        <h2 style="margin: 0; font-size: 16px; font-weight: 700">书桌显示器</h2>
        <span style="font-size: 14px; color: var(--muted)">当前输入源：<strong style="color: var(--ink)">USB-C</strong>（读回，3 秒前）</span>
      </div>
      <div style="margin-top: 12px; display: flex; flex-wrap: wrap; gap: 10px">
        <sc-for list="{{caps}}" as="c" hint-placeholder-count="4">
          <div style="flex: 1 1 200px; padding: 10px 12px; border-radius: 12px; border: 1px solid var(--edge)">
            <div style="display: flex; align-items: center; justify-content: space-between; gap: 8px"><span style="font-size: 14px; font-weight: 500">{{c.name}}</span><span style="padding: 1px 9px; border-radius: 999px; font-size: 12px; font-weight: 500; color: {{c.c}}; background: {{c.bg}}; border: 1px solid {{c.bd}}">{{c.text}}</span></div>
            <div style="margin-top: 4px; font-size: 12px; color: var(--muted)">{{c.note}}</div>
          </div>
        </sc-for>
      </div>
      <div style="margin-top: 14px; font-size: 14px; font-weight: 500">输入映射</div>
      <div style="margin-top: 6px; display: flex; flex-direction: column">
        <sc-for list="{{inputs}}" as="i" hint-placeholder-count="2">
          <div style="display: flex; flex-wrap: wrap; gap: 10px; padding: 8px 0; border-top: 1px solid var(--edge); font-size: 14px"><span style="flex: 1 1 140px; font-family: ui-monospace, monospace">{{i.id}}</span><span style="flex: 1 1 140px; color: var(--muted)">{{i.label}}</span><span style="flex: 0 0 90px; color: var(--muted)">值 {{i.value}}</span></div>
        </sc-for>
      </div>
    </section>

    <section style="padding: 18px; border-radius: 16px; border: 1px solid var(--edge); background: var(--glass); backdrop-filter: blur(14px); box-shadow: var(--lift)">
      <h2 style="margin: 0 0 8px; font-size: 16px; font-weight: 700">已注册动作</h2>
      <div style="display: flex; flex-direction: column">
        <sc-for list="{{actions}}" as="a" hint-placeholder-count="4">
          <div style="display: flex; flex-wrap: wrap; align-items: center; gap: 10px; padding: 10px 0; border-top: 1px solid var(--edge)">
            <span style="flex: 1 1 170px; font-size: 15px; font-weight: 500">{{a.label}}</span>
            <span style="flex: 1 1 190px; font-size: 13px; font-family: ui-monospace, monospace; color: var(--muted)">{{a.id}}</span>
            <span style="flex: 1 1 150px; font-size: 13px; color: var(--muted)">{{a.target}}</span>
            <span style="flex: 0 0 100px; font-size: 13px; color: var(--muted)">{{a.key}}</span>
          </div>
        </sc-for>
      </div>
    </section>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"mode":{"editor":"enum","default":"dark","options":["dark","light"]},"$preview":{"width":1280,"height":800}}'>
class Component extends DCLogic {
  renderVals() {
    const T = {
      dark: '--bg2:#082520;--glow:rgba(94,230,184,0.10);--glass:rgba(11,29,26,0.72);--lift:0 10px 32px rgba(0,0,0,0.28), inset 0 1px 0 rgba(255,255,255,0.04);--bg:#040d0c;--side:#071713;--card:#0b1d1a;--edge:#1b3d37;--ink:#e6f7f2;--muted:#8aa8a1;--accent:#5ee6b8;--sel:#103a30;--wifi:#4fd1ff;--agent:#5be38c;--power:#f2b544;--time:#c38bff;--danger:#ff7b7b;',
      light: '--bg:#f3f8f6;--side:#ffffff;--card:#ffffff;--edge:#d3e2de;--ink:#10231f;--muted:#566e68;--accent:#0b7a5f;--sel:#dff3ec;--wifi:#086a96;--agent:#146b34;--power:#8f5a00;--time:#6a3aae;--danger:#b02e22;--bg2:#e4f1ec;--glow:rgba(11,122,95,0.08);--glass:rgba(255,255,255,0.82);--lift:0 8px 24px rgba(16,35,31,0.08);'
    };
    const K = (v) => ({ c: 'var(--' + v + ')', bg: 'color-mix(in srgb, var(--' + v + ') 15%, transparent)', bd: 'color-mix(in srgb, var(--' + v + ') 50%, transparent)' });
    const names = ['概览', '设备', '动作与显示器', '命令记录', '布局与显示', '电源', '固件升级', '访问管理', '外观'];
    const active = 2;
    return {
      vars: T[this.props.mode] || T.dark,
      nav: names.map((label, i) => ({
        label,
        badge: label === '设备' ? '1' : '',
        weight: i === active ? 500 : 400,
        bg: i === active ? 'var(--sel)' : 'transparent',
        glow: i === active ? 'inset 3px 0 0 var(--accent), 0 0 20px color-mix(in srgb, var(--accent) 22%, transparent)' : 'none',
        ink: i === active ? 'var(--accent)' : 'var(--muted)'
      })),
      caps: [
        { name: '设置输入源', text: '实验', note: '命令已能下发，真实切出、切回还没有证据', ...K('power') },
        { name: '读取当前输入源', text: '可用', note: '读回已启用', ...K('agent') },
        { name: '枚举可选输入源', text: '不可用', note: '只使用你配置的映射', ...K('muted') },
        { name: '切走后的控制通道', text: '未验证', note: '需要在真实显示器上试一次', ...K('power') }
      ],
      inputs: [
        { id: 'mac-usbc', label: 'Mac · USB-C', value: 15 },
        { id: 'pc-dp', label: 'PC · DisplayPort', value: 17 }
      ],
      actions: [
        { label: '切到 Mac', id: 'desktop.switch_to_mac', target: '书桌显示器 → mac-usbc', key: 'Ctrl+Alt+1' },
        { label: '切到 PC', id: 'desktop.switch_to_pc', target: '书桌显示器 → pc-dp', key: '未设置' },
        { label: '切到笔记本', id: 'desktop.switch_to_laptop', target: '书桌显示器 → laptop-hdmi', key: '未设置' },
        { label: '备用输入', id: 'desktop.switch_spare', target: '书桌显示器 → spare-dp', key: '未设置' }
      ]
    };
  }
}
</script>
</body>
</html>
