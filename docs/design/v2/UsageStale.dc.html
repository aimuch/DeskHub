<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>设置 页面与首页</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600&amp;family=Noto+Sans+SC:wght@400;500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:inherit;text-decoration:none}
</style>
</helmet>
<div style="width: 480px; height: 480px; position: relative; overflow: hidden; border-radius: 72px; background-color: #000000; background-image: linear-gradient(rgba(255,255,255,0.025) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,0.025) 1px, transparent 1px); background-size: 40px 40px; font-family: 'Noto Sans SC', 'Montserrat', sans-serif; color: #e8f3f7">

  <div style="position: absolute; left: 52px; right: 52px; top: 20px; height: 28px; display: flex; align-items: center; justify-content: space-between">
    <div style="display: flex; gap: 14px; align-items: center">
      <svg width="24" height="22" viewBox="0 0 24 24" fill="none" stroke="#2fd8ff" stroke-width="2" stroke-linecap="round" role="img" aria-label="Wi-Fi 已连接"><path d="M2 9a15 15 0 0 1 20 0"></path><path d="M5.5 12.5a10 10 0 0 1 13 0"></path><path d="M9 16a5 5 0 0 1 6 0"></path><path d="M12 19.5h.01"></path></svg>
      <svg width="24" height="22" viewBox="0 0 24 24" fill="none" stroke="#59f0a6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" role="img" aria-label="App 在线"><rect x="2.5" y="3.5" width="19" height="12.5" rx="2.5"></rect><path d="M8.5 20.5h7M12 16v4.5"></path></svg>
    </div>
    <div role="img" aria-label="电量 96%" style="width: 44px; height: 20px; box-sizing: border-box; border: 1.5px solid #59f0a6; border-radius: 6px; position: relative; display: flex; align-items: center; justify-content: center">
      <div style="position: absolute; left: 2px; top: 2px; bottom: 2px; width: 34px; border-radius: 3px; background: rgba(89,240,166,0.35)"></div>
      <span style="position: relative; font-family: Montserrat, sans-serif; font-weight: 600; font-size: 12px">96</span>
    </div>
  </div>

  <div style="position: absolute; left: 44px; right: 44px; top: 62px; height: 340px; display: flex; flex-direction: column; gap: 10px">
    <div style="display: flex; align-items: center; justify-content: space-between; height: 24px">
      <span style="font-size: 15px; color: #9fb4be">Codex · plus</span>
      <span style="font-size: 13px; color: #ffb547">数据过期 · 3 分钟前</span>
    </div>
    <div style="display: flex; gap: 10px">
      <div style="flex: 1; border-radius: 18px; background: #070b10; box-shadow: inset 0 0 0 1px #15212b; padding: 12px 14px; display: flex; flex-direction: column; gap: 6px">
        <div style="display: flex; justify-content: space-between; font-size: 13px; color: #7f97a3"><span>5 小时</span><span>剩余</span></div>
        <div style="font-family: Montserrat, sans-serif; font-weight: 400; font-size: 38px; line-height: 1; color: #5c7480">100<span style="font-size: 18px; color: #7f97a3">%</span></div>
        <div style="height: 6px; border-radius: 3px; background: #15212b"><div style="width: 100%; height: 100%; border-radius: 3px; background: #1d2b35"></div></div>
        <div style="font-size: 12px; color: #7f97a3">4 小时 12 分后重置</div>
      </div>
      <div style="flex: 1; border-radius: 18px; background: #070b10; box-shadow: inset 0 0 0 1px #15212b; padding: 12px 14px; display: flex; flex-direction: column; gap: 6px">
        <div style="display: flex; justify-content: space-between; font-size: 13px; color: #7f97a3"><span>7 天</span><span>剩余</span></div>
        <div style="font-family: Montserrat, sans-serif; font-weight: 400; font-size: 38px; line-height: 1; color: #5c7480">37<span style="font-size: 18px; color: #7f97a3">%</span></div>
        <div style="height: 6px; border-radius: 3px; background: #15212b"><div style="width: 37%; height: 100%; border-radius: 3px; background: #1d2b35"></div></div>
        <div style="font-size: 12px; color: #7f97a3">周三 09:40 重置</div>
      </div>
    </div>
    <div style="border-radius: 18px; background: #070b10; box-shadow: inset 0 0 0 1px #15212b; padding: 10px 6px; display: flex">
      <div style="flex: 1; display: flex; flex-direction: column; align-items: center; gap: 2px"><span style="font-family: Montserrat, sans-serif; font-size: 22px; color: #5c7480">128</span><span style="font-size: 12px; color: #7f97a3">今天调用</span></div><div style="flex: 1; display: flex; flex-direction: column; align-items: center; gap: 2px"><span style="font-family: Montserrat, sans-serif; font-size: 22px; color: #5c7480">1.2M</span><span style="font-size: 12px; color: #7f97a3">今天 Token</span></div><div style="flex: 1; display: flex; flex-direction: column; align-items: center; gap: 2px"><span style="font-family: Montserrat, sans-serif; font-size: 22px; color: #5c7480">98.4%</span><span style="font-size: 12px; color: #7f97a3">成功率</span></div><div style="flex: 1; display: flex; flex-direction: column; align-items: center; gap: 2px"><span style="font-family: Montserrat, sans-serif; font-size: 22px; color: #5c7480">820</span><span style="font-size: 12px; color: #7f97a3">首字 ms</span></div>
    </div>
    <div style="border-radius: 18px; background: #070b10; box-shadow: inset 0 0 0 1px #15212b; padding: 10px 14px; display: flex; flex-direction: column; gap: 3px">
      <div style="display: flex; justify-content: space-between; font-size: 12px; color: #7f97a3"><span>最近一次</span><span>2 分钟前</span></div>
      <div style="display: flex; gap: 10px; align-items: baseline; font-size: 15px; color: #5c7480"><span style="flex: 1; overflow: hidden; white-space: nowrap; text-overflow: ellipsis">gpt-6.1-sol</span><span style="color: #5c7480">200</span><span>3.2 秒</span></div>
    </div>
  </div>
  <nav aria-label="主导航" style="position: absolute; left: 44px; right: 44px; bottom: 18px; height: 60px; box-sizing: border-box; padding: 4px; display: flex; gap: 4px; border-radius: 30px; background: #05080c; box-shadow: inset 0 0 0 1px #15212b">
    <a href="Main.dc.html" style="flex: 1; min-width: 0; border-radius: 26px; display: flex; align-items: center; justify-content: center; font-size: 17px; color: #9fb4be">切源</a>
    <a href="HomeRing.dc.html" style="flex: 1; min-width: 0; border-radius: 26px; display: flex; align-items: center; justify-content: center; font-size: 17px; color: #9fb4be">总览</a>
    <a href="Usage.dc.html" aria-current="page" style="flex: 1; min-width: 0; border-radius: 26px; display: flex; align-items: center; justify-content: center; font-size: 17px; color: {{accent}}; background: {{accentSoft}}; box-shadow: inset 0 0 0 1px {{accentLine}}">用量</a>
    <a href="Settings.dc.html" style="flex: 1; min-width: 0; border-radius: 26px; display: flex; align-items: center; justify-content: center; font-size: 17px; color: #9fb4be">设置</a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#2fd8ff","options":["#2fd8ff","#5ee6b8","#ff9e4a"]},"$preview":{"width":480,"height":480}}'>
class Component extends DCLogic {
  renderVals() {
    const a = this.props.accent ?? '#2fd8ff';
    const rgb = [1, 3, 5].map((i) => parseInt(a.slice(i, i + 2), 16)).join(',');
    return { accent: a, accentSoft: 'rgba(' + rgb + ',0.12)', accentLine: 'rgba(' + rgb + ',0.6)', accentGlow: '0 0 20px rgba(' + rgb + ',0.32)' };
  }
}
</script>
</body>
</html>
