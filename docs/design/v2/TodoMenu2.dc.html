<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>待办 长按 更改</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600&amp;family=Noto+Sans+SC:wght@400;500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 480px; height: 480px; position: relative; overflow: hidden; border-radius: 72px; background-color: #000000; font-family: 'Noto Sans SC', 'Montserrat', sans-serif; color: #e8f3f7">
  <div aria-hidden="true" style="position: absolute; left: 44px; right: 44px; top: 58px; height: 346px; display: flex; flex-direction: column; gap: 4px; opacity: 0.22">
    <div style="height: 40px"></div>
    <div style="height: 56px; border-radius: 14px; background: #070b10; box-shadow: inset 0 0 0 1px #15212b"></div>
    <div style="height: 56px; border-radius: 14px; background: #070b10; box-shadow: inset 0 0 0 1px #15212b"></div>
    <div style="height: 56px; border-radius: 14px; background: #0d2c36"></div>
  </div>
  <div role="dialog" aria-label="这条待办的操作" style="position: absolute; left: 48px; right: 48px; top: 56px; box-sizing: border-box; padding: 20px; border-radius: 28px; background: #0a1118; box-shadow: inset 0 0 0 1px #1f3140, 0 18px 48px rgba(0,0,0,0.6); display: flex; flex-direction: column; gap: 10px">
    <div style="display: flex; flex-direction: column; gap: 4px; padding: 0 4px 4px">
      <span style="font-size: 18px; line-height: 1.35">回复设计评审的意见，附上新的截图和改过的流程</span>
      <span style="font-size: 13px; color: #9fb4be">工作 · 今天 14:30 · 每周 · 响铃</span>
    </div>
    <button type="button" style="all: unset; box-sizing: border-box; height: 56px; border-radius: 16px; display: flex; align-items: center; justify-content: center; font-size: 18px; font-weight: 500; color: #000000; background: {{accent}}">完成</button>
    <div style="display: flex; gap: 10px">
      <button type="button" style="all: unset; box-sizing: border-box; flex: 1; height: 56px; border-radius: 16px; display: flex; align-items: center; justify-content: center; font-size: 17px; color: #e8f3f7; background: #101b24; box-shadow: inset 0 0 0 1px #1f3140">推迟到明天</button>
      <button type="button" style="all: unset; box-sizing: border-box; flex: 1; height: 56px; border-radius: 16px; display: flex; align-items: center; justify-content: center; font-size: 17px; color: {{accent}}; background: #101b24; box-shadow: inset 0 0 0 1px {{accentLine}}">更改…</button>
    </div>
    <div style="display: flex; gap: 10px">
      <button type="button" style="all: unset; box-sizing: border-box; flex: 1; height: 56px; border-radius: 16px; display: flex; align-items: center; justify-content: center; font-size: 17px; color: #ffb547; background: #101b24; box-shadow: inset 0 0 0 1px #1f3140">删除…</button>
      <button type="button" style="all: unset; box-sizing: border-box; flex: 1; height: 56px; border-radius: 16px; display: flex; align-items: center; justify-content: center; font-size: 17px; color: #9fb4be">取消</button>
    </div>
  </div>
  <div style="position: absolute; left: 0; right: 0; bottom: 40px; text-align: center; font-size: 13px; color: #7f97a3">点对话框外面也是取消</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#2fd8ff","options":["#2fd8ff","#5ee6b8","#ff9e4a"]},"$preview":{"width":480,"height":480}}'>
class Component extends DCLogic {
  renderVals() {
    const a = this.props.accent ?? '#2fd8ff';
    const rgb = [1, 3, 5].map((i) => parseInt(a.slice(i, i + 2), 16)).join(',');
    return { accent: a, accentLine: 'rgba(' + rgb + ',0.6)' };
  }
}
</script>
</body>
</html>
