<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>设置 改输入源</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600&amp;family=Noto+Sans+SC:wght@400;500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:inherit;text-decoration:none}
</style>
</helmet>
<div style="width: 480px; height: 480px; position: relative; overflow: hidden; border-radius: 72px; background-color: #000000; background-image: linear-gradient(rgba(255,255,255,0.025) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,0.025) 1px, transparent 1px); background-size: 40px 40px; font-family: 'Noto Sans SC', 'Montserrat', sans-serif; color: #e8f3f7">

  <div style="position: absolute; left: 52px; right: 52px; top: 20px; height: 28px; display: flex; align-items: center; justify-content: space-between">
    <div style="display: flex; gap: 14px; align-items: center">
      <svg width="24" height="22" viewBox="0 0 24 24" fill="none" stroke="#2fd8ff" stroke-width="2" stroke-linecap="round" role="img" aria-label="Wi-Fi 已连接"><path d="M2 9a15 15 0 0 1 20 0"></path><path d="M5.5 12.5a10 10 0 0 1 13 0"></path><path d="M9 16a5 5 0 0 1 6 0"></path><path d="M12 19.5h.01"></path></svg>
      <svg width="24" height="22" viewBox="0 0 24 24" fill="none" stroke="#59f0a6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" role="img" aria-label="App 在线"><rect x="2.5" y="3.5" width="19" height="12.5" rx="2.5"></rect><path d="M8.5 20.5h7M12 16v4.5"></path></svg>
    </div>
    <div role="img" aria-label="电量 96%" style="width: 44px; height: 20px; box-sizing: border-box; border: 1.5px solid #59f0a6; border-radius: 6px; position: relative; display: flex; align-items: center; justify-content: center">
      <div style="position: absolute; left: 2px; top: 2px; bottom: 2px; width: 34px; border-radius: 3px; background: rgba(89,240,166,0.35)"></div>
      <span style="position: relative; font-family: Montserrat, sans-serif; font-weight: 600; font-size: 12px">96</span>
    </div>
  </div>

  <div style="position: absolute; left: 44px; right: 44px; top: 58px; display: flex; flex-direction: column; gap: 8px">
    <div style="display: flex; align-items: center; gap: 8px">
      <a href="Sources.dc.html" aria-label="返回" style="width: 44px; height: 44px; margin-left: -10px; border-radius: 22px; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#9fb4be" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg></a>
      <span style="flex: 1; font-size: 22px; font-weight: 500">改输入源</span><span style="font-family: Montserrat, sans-serif; font-size: 11px; letter-spacing: 1px; color: #7f97a3">DISPLAYPORT</span>
    </div>
    <a href="#" style="height: 56px; box-sizing: border-box; padding: 0 16px; display: flex; align-items: center; gap: 12px; border-radius: 16px; background: #070b10; box-shadow: inset 0 0 0 1px #15212b">
      <span style="font-size: 14px; color: #7f97a3">名字</span>
      <span style="flex: 1; font-size: 18px">Mac mini</span>
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#9fb4be" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-label="用键盘改"><rect x="2.5" y="6" width="19" height="12" rx="2"></rect><path d="M6 10h.01M10 10h.01M14 10h.01M18 10h.01M7 14h10"></path></svg>
    </a>
    <div style="font-size: 13px; color: #7f97a3">图标</div>
    <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px">
      <button type="button" aria-pressed="false" style="all: unset; box-sizing: border-box; height: 64px; border-radius: 14px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; background: #070b10; box-shadow: inset 0 0 0 1px #15212b"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#9fb4be" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 8.5h18v4.5l-2.5 2.5h-13L3 13z"></path><path d="M7 11.5h10"></path></svg><span style="font-size: 11px; color: #7f97a3">HDMI</span></button>
      <button type="button" aria-pressed="false" style="all: unset; box-sizing: border-box; height: 64px; border-radius: 14px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; background: #070b10; box-shadow: inset 0 0 0 1px #15212b"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#9fb4be" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 8.5h18v7H6.5L3 12z"></path><path d="M8 12h9"></path></svg><span style="font-size: 11px; color: #7f97a3">DP</span></button>
      <button type="button" aria-pressed="false" style="all: unset; box-sizing: border-box; height: 64px; border-radius: 14px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; background: #070b10; box-shadow: inset 0 0 0 1px #15212b"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#9fb4be" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="9" width="18" height="6.5" rx="3.25"></rect><path d="M8 12.25h8"></path></svg><span style="font-size: 11px; color: #7f97a3">USB-C</span></button>
      <button type="button" aria-pressed="false" style="all: unset; box-sizing: border-box; height: 64px; border-radius: 14px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; background: #070b10; box-shadow: inset 0 0 0 1px #15212b"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#9fb4be" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="5.5" width="14" height="9.5" rx="1.5"></rect><path d="M2.5 18.5h19"></path></svg><span style="font-size: 11px; color: #7f97a3">笔记本</span></button>
      <button type="button" aria-pressed="true" style="all: unset; box-sizing: border-box; height: 64px; border-radius: 14px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; background: {{accentSoft}}; box-shadow: inset 0 0 0 1.5px {{accentLine}}"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="{{accent}}" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="9" width="17" height="7" rx="2.5"></rect><path d="M8 19h8"></path></svg><span style="font-size: 11px; color: {{accent}}">主机</span></button>
      <button type="button" aria-pressed="false" style="all: unset; box-sizing: border-box; height: 64px; border-radius: 14px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; background: #070b10; box-shadow: inset 0 0 0 1px #15212b"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#9fb4be" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4.5" width="18" height="12" rx="2"></rect><path d="M12 16.5v4M8.5 20.5h7"></path></svg><span style="font-size: 11px; color: #7f97a3">显示器</span></button>
      <button type="button" aria-pressed="false" style="all: unset; box-sizing: border-box; height: 64px; border-radius: 14px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; background: #070b10; box-shadow: inset 0 0 0 1px #15212b"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#9fb4be" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 8h10a4 4 0 0 1 4 4v1.5a3 3 0 0 1-5.4 1.8L14.5 14h-5l-1.1 1.3A3 3 0 0 1 3 13.5V12a4 4 0 0 1 4-4z"></path><path d="M7.5 10.5v3M6 12h3"></path><path d="M16 11h.01M17.5 13h.01"></path></svg><span style="font-size: 11px; color: #7f97a3">游戏机</span></button>
      <button type="button" aria-pressed="false" style="all: unset; box-sizing: border-box; height: 64px; border-radius: 14px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; background: #070b10; box-shadow: inset 0 0 0 1px #15212b"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#9fb4be" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2.5" y="5" width="19" height="12" rx="1.5"></rect><path d="M7 20.5h10"></path><path d="M9 2.5l3 2.5 3-2.5"></path></svg><span style="font-size: 11px; color: #7f97a3">电视</span></button>
    </div>
    <div style="display: flex; gap: 8px">
      <button type="button" style="all: unset; flex: 1; height: 48px; border-radius: 16px; display: flex; align-items: center; justify-content: center; font-size: 15px; color: #9fb4be; box-shadow: inset 0 0 0 1px #15212b">恢复 App 的名字和图标</button>
    </div>
  </div>
  <nav aria-label="主导航" style="position: absolute; left: 44px; right: 44px; bottom: 18px; height: 60px; box-sizing: border-box; padding: 4px; display: flex; gap: 4px; border-radius: 30px; background: #05080c; box-shadow: inset 0 0 0 1px #15212b">
    <a href="Main.dc.html" style="flex: 1; min-width: 0; border-radius: 26px; display: flex; align-items: center; justify-content: center; font-size: 17px; color: #9fb4be">切换</a>
    <a href="HomeRing.dc.html" style="flex: 1; min-width: 0; border-radius: 26px; display: flex; align-items: center; justify-content: center; font-size: 17px; color: #9fb4be">总览</a>
    <a href="Settings.dc.html" aria-current="page" style="flex: 1; min-width: 0; border-radius: 26px; display: flex; align-items: center; justify-content: center; font-size: 17px; color: {{accent}}; background: {{accentSoft}}; box-shadow: inset 0 0 0 1px {{accentLine}}">设置</a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#2fd8ff","options":["#2fd8ff","#5ee6b8","#ff9e4a"]},"$preview":{"width":480,"height":480}}'>
class Component extends DCLogic {
  renderVals() {
    const a = this.props.accent ?? '#2fd8ff';
    const rgb = [1, 3, 5].map((i) => parseInt(a.slice(i, i + 2), 16)).join(',');
    return { accent: a, accentSoft: 'rgba(' + rgb + ',0.12)', accentLine: 'rgba(' + rgb + ',0.6)', accentGlow: '0 0 20px rgba(' + rgb + ',0.32)' };
  }
}
</script>
</body>
</html>
