<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>待办 删除确认</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600&amp;family=Noto+Sans+SC:wght@400;500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:inherit;text-decoration:none}
</style>
</helmet>
<div style="width: 480px; height: 480px; position: relative; overflow: hidden; border-radius: 72px; background-color: #000000; font-family: 'Noto Sans SC', 'Montserrat', sans-serif; color: #e8f3f7">

  <div aria-hidden="true" style="position: absolute; left: 44px; right: 44px; top: 58px; height: 346px; display: flex; flex-direction: column; gap: 4px; opacity: 0.22">
    <div style="height: 22px"></div>
    <div style="height: 18px"></div>
    <div style="height: 44px; border-radius: 14px; background: #070b10; box-shadow: inset 0 0 0 1px #15212b"></div>
    <div style="height: 44px; border-radius: 14px; background: #070b10; box-shadow: inset 0 0 0 1px #15212b"></div>
    <div style="height: 18px"></div>
    <div style="height: 70px; border-radius: 14px; background: #0d2c36"></div>
    <div style="height: 44px; border-radius: 14px; background: #070b10; box-shadow: inset 0 0 0 1px #15212b"></div>
  </div>

  <div role="alertdialog" aria-label="删除这条待办" style="position: absolute; left: 56px; right: 56px; top: 96px; box-sizing: border-box; padding: 22px 18px 16px; border-radius: 28px; background: #0a1118; box-shadow: inset 0 0 0 1px #4a3a1c, 0 18px 48px rgba(0,0,0,0.6); display: flex; flex-direction: column; gap: 12px">
    <div style="display: flex; flex-direction: column; gap: 8px; padding: 0 4px">
      <span style="font-size: 20px; font-weight: 500; color: #ffb547">删除这条待办？</span>
      <span style="font-size: 16px; line-height: 1.35">回复设计评审的意见，附上新的截图和改过的流程</span>
      <span style="font-size: 13px; line-height: 1.45; color: #9fb4be">Mac 的提醒事项里也会删掉，不能恢复。</span>
    </div>
    <div style="display: flex; gap: 10px; padding-top: 4px">
      <button type="button" style="all: unset; box-sizing: border-box; flex: 1; height: 52px; border-radius: 16px; display: flex; align-items: center; justify-content: center; font-size: 17px; color: #e8f3f7; background: #101b24; box-shadow: inset 0 0 0 1px #1f3140">取消</button>
      <button type="button" style="all: unset; box-sizing: border-box; flex: 1; height: 52px; border-radius: 16px; display: flex; align-items: center; justify-content: center; font-size: 17px; font-weight: 500; color: #000000; background: #ffb547">删除</button>
    </div>
  </div>

  <div style="position: absolute; left: 0; right: 0; bottom: 34px; text-align: center; font-size: 13px; color: #7f97a3">10 秒不点就自动取消</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":480,"height":480}}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
