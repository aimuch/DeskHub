<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>桌面时钟</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@200;300;400;500;600&amp;family=Noto+Sans+SC:wght@400;500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:inherit;text-decoration:none}
</style>
</helmet>
<div style="width: 480px; height: 480px; position: relative; overflow: hidden; border-radius: 72px; background-color: #000000; background-image: linear-gradient(rgba(255,255,255,0.025) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,0.025) 1px, transparent 1px); background-size: 40px 40px; font-family: 'Noto Sans SC', 'Montserrat', sans-serif; color: #e8f3f7">

  <div style="position: absolute; left: 52px; right: 52px; top: 20px; height: 28px; display: flex; align-items: center; justify-content: space-between">
    <div style="display: flex; gap: 14px; align-items: center">
      <svg width="24" height="22" viewBox="0 0 24 24" fill="none" stroke="#2fd8ff" stroke-width="2" stroke-linecap="round" role="img" aria-label="Wi-Fi 已连接"><path d="M2 9a15 15 0 0 1 20 0"></path><path d="M5.5 12.5a10 10 0 0 1 13 0"></path><path d="M9 16a5 5 0 0 1 6 0"></path><path d="M12 19.5h.01"></path></svg>
      <svg width="24" height="22" viewBox="0 0 24 24" fill="none" stroke="#59f0a6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" role="img" aria-label="App 在线"><rect x="2.5" y="3.5" width="19" height="12.5" rx="2.5"></rect><path d="M8.5 20.5h7M12 16v4.5"></path></svg>
    </div>
    <div role="img" aria-label="电量 96%" style="width: 44px; height: 20px; box-sizing: border-box; border: 1.5px solid #59f0a6; border-radius: 6px; position: relative; display: flex; align-items: center; justify-content: center">
      <div style="position: absolute; left: 2px; top: 2px; bottom: 2px; width: 34px; border-radius: 3px; background: rgba(89,240,166,0.35)"></div>
      <span style="position: relative; font-family: Montserrat, sans-serif; font-weight: 600; font-size: 12px">96</span>
    </div>
  </div>

  <svg width="300" height="300" viewBox="0 0 300 300" aria-hidden="true" style="position: absolute; left: 90px; top: 62px">
    <circle cx="150" cy="150" r="140" fill="none" stroke="#15212b" stroke-width="10" stroke-dasharray="2 12.66"></circle>
    <circle cx="150" cy="150" r="140" fill="none" stroke="{{accent}}" stroke-width="10" stroke-dasharray="2 12.66" stroke-dashoffset="0" pathLength="879.6" style="stroke-dasharray: 2 12.66; clip-path: inset(0 0 50% 50%)"></circle>
    <circle cx="150" cy="150" r="124" fill="none" stroke="#0d151c" stroke-width="1"></circle>
    <g stroke-linecap="round">
      <line x1="150" y1="150" x2="190" y2="96" stroke="#e8f3f7" stroke-width="8"></line>
      <line x1="150" y1="150" x2="150" y2="44" stroke="#e8f3f7" stroke-width="5" transform="rotate(192 150 150)"></line>
      <line x1="150" y1="172" x2="150" y2="34" stroke="{{accent}}" stroke-width="2" transform="rotate(288 150 150)"></line>
      <circle cx="150" cy="150" r="7" fill="{{accent}}"></circle>
    </g>
  </svg>

  <div style="position: absolute; left: 90px; top: 62px; width: 300px; height: 300px; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; padding-bottom: 54px; box-sizing: border-box; gap: 2px">
    <div style="display: flex; align-items: flex-end; gap: 6px">
      <span style="font-family: Montserrat, sans-serif; font-weight: 300; font-size: 34px; line-height: 1; letter-spacing: 0">14:32</span>
      <span style="font-family: Montserrat, sans-serif; font-weight: 500; font-size: 14px; line-height: 1.6; color: {{accent}}">48</span>
    </div>
  </div>

  <nav aria-label="主导航" style="position: absolute; left: 44px; right: 44px; bottom: 18px; height: 60px; box-sizing: border-box; padding: 4px; display: flex; gap: 4px; border-radius: 30px; background: #05080c; box-shadow: inset 0 0 0 1px #15212b">
    <a href="Main.dc.html" style="flex: 1; min-width: 0; border-radius: 26px; display: flex; align-items: center; justify-content: center; font-size: 17px; color: #9fb4be">切换</a>
    <a href="HomeRing.dc.html" style="flex: 1; min-width: 0; border-radius: 26px; display: flex; align-items: center; justify-content: center; font-size: 17px; color: #9fb4be">总览</a>
    <a href="HomeClock.dc.html" aria-current="page" style="flex: 1; min-width: 0; border-radius: 26px; display: flex; align-items: center; justify-content: center; font-size: 17px; color: {{accent}}; background: {{accentSoft}}; box-shadow: inset 0 0 0 1px {{accentLine}}">时钟</a>
    <a href="HomePower.dc.html" style="flex: 1; min-width: 0; border-radius: 26px; display: flex; align-items: center; justify-content: center; font-size: 17px; color: #9fb4be">电源</a>
    <a href="Settings.dc.html" style="flex: 1; min-width: 0; border-radius: 26px; display: flex; align-items: center; justify-content: center; font-size: 17px; color: #9fb4be">设置</a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#2fd8ff","options":["#2fd8ff","#5ee6b8","#ff9e4a"]},"$preview":{"width":480,"height":480}}'>
class Component extends DCLogic {
  renderVals() {
    const a = this.props.accent ?? '#2fd8ff';
    const rgb = [1, 3, 5].map((i) => parseInt(a.slice(i, i + 2), 16)).join(',');
    return { accent: a, accentSoft: 'rgba(' + rgb + ',0.12)', accentLine: 'rgba(' + rgb + ',0.6)' };
  }
}
</script>
</body>
</html>
