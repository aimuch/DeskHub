<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>设置 外观</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600&amp;family=Noto+Sans+SC:wght@400;500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:inherit;text-decoration:none}
</style>
</helmet>
<div style="width: 480px; height: 480px; position: relative; overflow: hidden; border-radius: 72px; background-color: #000000; background-image: linear-gradient(rgba(255,255,255,0.025) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,0.025) 1px, transparent 1px); background-size: 40px 40px; font-family: 'Noto Sans SC', 'Montserrat', sans-serif; color: #e8f3f7">

  <div style="position: absolute; left: 52px; right: 52px; top: 20px; height: 28px; display: flex; align-items: center; justify-content: space-between">
    <div style="display: flex; gap: 14px; align-items: center">
      <svg width="24" height="22" viewBox="0 0 24 24" fill="none" stroke="#2fd8ff" stroke-width="2" stroke-linecap="round" role="img" aria-label="Wi-Fi 已连接"><path d="M2 9a15 15 0 0 1 20 0"></path><path d="M5.5 12.5a10 10 0 0 1 13 0"></path><path d="M9 16a5 5 0 0 1 6 0"></path><path d="M12 19.5h.01"></path></svg>
      <svg width="24" height="22" viewBox="0 0 24 24" fill="none" stroke="#59f0a6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" role="img" aria-label="App 在线"><rect x="2.5" y="3.5" width="19" height="12.5" rx="2.5"></rect><path d="M8.5 20.5h7M12 16v4.5"></path></svg>
    </div>
    <div role="img" aria-label="电量 96%" style="width: 44px; height: 20px; box-sizing: border-box; border: 1.5px solid #59f0a6; border-radius: 6px; position: relative; display: flex; align-items: center; justify-content: center">
      <div style="position: absolute; left: 2px; top: 2px; bottom: 2px; width: 34px; border-radius: 3px; background: rgba(89,240,166,0.35)"></div>
      <span style="position: relative; font-family: Montserrat, sans-serif; font-weight: 600; font-size: 12px">96</span>
    </div>
  </div>

  <div style="position: absolute; left: 44px; right: 44px; top: 58px; display: flex; flex-direction: column; gap: 10px">
    <div style="display: flex; align-items: center; gap: 8px">
      <a href="Settings.dc.html" aria-label="返回" style="width: 44px; height: 44px; margin-left: -10px; border-radius: 22px; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#9fb4be" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg></a>
      <span style="flex: 1; font-size: 22px; font-weight: 500">外观</span>
    </div>
    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
      <button type="button" aria-pressed="true" style="all: unset; box-sizing: border-box; height: 104px; padding: 10px; border-radius: 18px; display: flex; flex-direction: column; gap: 8px; background: linear-gradient(#000000, #000000); box-shadow: inset 0 0 0 1.5px {{accentLine}}, {{accentGlow}}">
        <span style="flex: 1; border-radius: 10px; background: #070b10; display: flex; align-items: center; gap: 6px; padding: 0 10px"><span style="width: 26px; height: 6px; border-radius: 3px; background: {{accent}}"></span><span style="width: 40px; height: 6px; border-radius: 3px; background: #2a3a44"></span></span>
        <span style="font-size: 16px; color: {{accent}}">夜航（默认）</span>
      </button>
      <button type="button" aria-pressed="false" style="all: unset; box-sizing: border-box; height: 104px; padding: 10px; border-radius: 18px; display: flex; flex-direction: column; gap: 8px; background: linear-gradient(#03100e, #082520); box-shadow: inset 0 0 0 1px #15212b">
        <span style="flex: 1; border-radius: 10px; background: #0b1d1a; display: flex; align-items: center; gap: 6px; padding: 0 10px"><span style="width: 26px; height: 6px; border-radius: 3px; background: #5ee6b8"></span><span style="width: 40px; height: 6px; border-radius: 3px; background: #2a3a44"></span></span>
        <span style="font-size: 16px; color: #e8f3f7">薄荷</span>
      </button>
      <button type="button" aria-pressed="false" style="all: unset; box-sizing: border-box; height: 104px; padding: 10px; border-radius: 18px; display: flex; flex-direction: column; gap: 8px; background: linear-gradient(#03131c, #062a3a); box-shadow: inset 0 0 0 1px #15212b">
        <span style="flex: 1; border-radius: 10px; background: #0a2130; display: flex; align-items: center; gap: 6px; padding: 0 10px"><span style="width: 26px; height: 6px; border-radius: 3px; background: #4fc3f7"></span><span style="width: 40px; height: 6px; border-radius: 3px; background: #2a3a44"></span></span>
        <span style="font-size: 16px; color: #e8f3f7">海洋</span>
      </button>
      <button type="button" aria-pressed="false" style="all: unset; box-sizing: border-box; height: 104px; padding: 10px; border-radius: 18px; display: flex; flex-direction: column; gap: 8px; background: linear-gradient(#120c08, #24150a); box-shadow: inset 0 0 0 1px #15212b">
        <span style="flex: 1; border-radius: 10px; background: #1e1510; display: flex; align-items: center; gap: 6px; padding: 0 10px"><span style="width: 26px; height: 6px; border-radius: 3px; background: #ff9e4a"></span><span style="width: 40px; height: 6px; border-radius: 3px; background: #2a3a44"></span></span>
        <span style="font-size: 16px; color: #e8f3f7">暖橙</span>
      </button>
    </div>
    <div style="font-size: 13px; color: #7f97a3">强调色</div>
    <div style="display: flex; gap: 14px; padding-left: 4px"><span style="width: 34px; height: 34px; border-radius: 17px; background: #2fd8ff; box-shadow: 0 0 0 3px #000000, 0 0 0 5px #2fd8ff"></span><span style="width: 34px; height: 34px; border-radius: 17px; background: #5ee6b8; "></span><span style="width: 34px; height: 34px; border-radius: 17px; background: #ff9e4a; "></span><span style="width: 34px; height: 34px; border-radius: 17px; background: #ff7eb6; "></span><span style="width: 34px; height: 34px; border-radius: 17px; background: #b69cff; "></span><span style="width: 34px; height: 34px; border-radius: 17px; background: #f2e05a; "></span></div>
    <div style="font-size: 13px; color: #5c7480">往上滑：文字大小、圆环粗细、电量数字、语言</div>
  </div>
  <nav aria-label="主导航" style="position: absolute; left: 44px; right: 44px; bottom: 18px; height: 60px; box-sizing: border-box; padding: 4px; display: flex; gap: 4px; border-radius: 30px; background: #05080c; box-shadow: inset 0 0 0 1px #15212b">
    <a href="Main.dc.html" style="flex: 1; min-width: 0; border-radius: 26px; display: flex; align-items: center; justify-content: center; font-size: 17px; color: #9fb4be">切换</a>
    <a href="HomeRing.dc.html" style="flex: 1; min-width: 0; border-radius: 26px; display: flex; align-items: center; justify-content: center; font-size: 17px; color: #9fb4be">总览</a>
    <a href="Settings.dc.html" aria-current="page" style="flex: 1; min-width: 0; border-radius: 26px; display: flex; align-items: center; justify-content: center; font-size: 17px; color: {{accent}}; background: {{accentSoft}}; box-shadow: inset 0 0 0 1px {{accentLine}}">设置</a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#2fd8ff","options":["#2fd8ff","#5ee6b8","#ff9e4a"]},"$preview":{"width":480,"height":480}}'>
class Component extends DCLogic {
  renderVals() {
    const a = this.props.accent ?? '#2fd8ff';
    const rgb = [1, 3, 5].map((i) => parseInt(a.slice(i, i + 2), 16)).join(',');
    return { accent: a, accentSoft: 'rgba(' + rgb + ',0.12)', accentLine: 'rgba(' + rgb + ',0.6)', accentGlow: '0 0 20px rgba(' + rgb + ',0.32)' };
  }
}
</script>
</body>
</html>
