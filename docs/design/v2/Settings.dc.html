<div style="width: 480px; height: 480px; position: relative; overflow: hidden; border-radius: 72px; background-color: #000000; background-image: linear-gradient(rgba(255,255,255,0.025) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,0.025) 1px, transparent 1px); background-size: 40px 40px; font-family: 'Noto Sans SC', 'Montserrat', sans-serif; color: #e8f3f7">

      <span style="font-size: 24px; font-weight: 500">设置</span>
      <span style="font-family: Montserrat, sans-serif; font-size: 11px; letter-spacing: 2px; color: #5c7480">SETTINGS</span>
    </div>
    <a href="Pages.dc.html" style="height: 56px; box-sizing: border-box; padding: 0 16px; display: flex; align-items: center; gap: 12px; border-radius: 16px; background: {{accentSoft}}; box-shadow: inset 0 0 0 1px {{accentLine}}">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="{{accent}}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="7" height="7" rx="1.5"></rect><rect x="14" y="4" width="7" height="7" rx="1.5"></rect><rect x="3" y="14" width="7" height="7" rx="1.5"></rect><path d="M14 17.5h7"></path></svg>

      <span style="font-size: 14px; color: {{accent}}">首页 切换</span>
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#3d5260" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg>

    <a href="Sources.dc.html" style="height: 56px; box-sizing: border-box; padding: 0 16px; display: flex; align-items: center; gap: 12px; border-radius: 16px; background: #070b10; box-shadow: inset 0 0 0 1px #15212b">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#9fb4be" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h13l-3-3M20 17H7l3 3"></path></svg>
      <span style="flex: 1; font-size: 18px">输入源</span>
      <span style="font-size: 14px; color: #7f97a3">图标 · 3 个</span>
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#3d5260" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg>
    </a>
    <a href="Appearance.dc.html" style="height: 56px; box-sizing: border-box; padding: 0 16px; display: flex; align-items: center; gap: 12px; border-radius: 16px; background: #070b10; box-shadow: inset 0 0 0 1px #15212b">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#9fb4be" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 3a9 9 0 0 0 0 18"></path></svg>
      <span style="flex: 1; font-size: 18px">外观</span>
      <span style="font-size: 14px; color: #7f97a3">夜航</span>
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#3d5260" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg>
    </a>
    <a href="Settings.dc.html" style="height: 56px; box-sizing: border-box; padding: 0 16px; display: flex; align-items: center; gap: 12px; border-radius: 16px; background: #070b10; box-shadow: inset 0 0 0 1px #15212b">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#9fb4be" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M2 12h2M20 12h2M5 5l1.5 1.5M17.5 17.5L19 19M5 19l1.5-1.5M17.5 6.5L19 5"></path></svg>
      <span style="flex: 1; font-size: 18px">显示与亮度</span>
      <span style="font-family: Montserrat, sans-serif; font-size: 14px; color: #7f97a3">50%</span>
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#3d5260" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg>
    </a>
    <a href="Settings.dc.html" style="height: 56px; box-sizing: border-box; padding: 0 16px; display: flex; align-items: center; gap: 12px; border-radius: 16px; background: #070b10; box-shadow: inset 0 0 0 1px #15212b">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#9fb4be" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 9a15 15 0 0 1 20 0"></path><path d="M5.5 12.5a10 10 0 0 1 13 0"></path><path d="M9 16a5 5 0 0 1 6 0"></path></svg>

      <span style="font-size: 14px; color: #7f97a3">Office</span>
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#3d5260" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg>

  </div>

  <div style="position: absolute; left: 0; right: 0; bottom: 84px; text-align: center; font-size: 12px; color: #5c7480">往上滑：电池与电源、声音、日期与时间、设备信息</div>
  <nav aria-label="主导航" style="position: absolute; left: 44px; right: 44px; bottom: 18px; height: 60px; box-sizing: border-box; padding: 4px; display: flex; gap: 4px; border-radius: 30px; background: #05080c; box-shadow: inset 0 0 0 1px #15212b">
    <a href="Main.dc.html" style="flex: 1; min-width: 0; border-radius: 26px; display: flex; align-items: center; justify-content: center; font-size: 17px; color: #9fb4be">切换</a>
    <a href="HomeRing.dc.html" style="flex: 1; min-width: 0; border-radius: 26px; display: flex; align-items: center; justify-content: center; font-size: 17px; color: #9fb4be">总览</a>
    <a href="Settings.dc.html" aria-current="page" style="flex: 1; min-width: 0; border-radius: 26px; display: flex; align-items: center; justify-content: center; font-size: 17px; color: {{accent}}; background: {{accentSoft}}; box-shadow: inset 0 0 0 1px {{accentLine}}">设置</a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#2fd8ff","options":["#2fd8ff","#5ee6b8","#ff9e4a"]},"$preview":{"width":480,"height":480}}'>
class Component extends DCLogic {
  renderVals() {
    const a = this.props.accent ?? '#2fd8ff';
    const rgb = [1, 3, 5].map((i) => parseInt(a.slice(i, i + 2), 16)).join(',');
    return { accent: a, accentSoft: 'rgba(' + rgb + ',0.12)', accentLine: 'rgba(' + rgb + ',0.6)', accentGlow: '0 0 20px rgba(' + rgb + ',0.32)' };
  }
}
</script>
</body>
</html>
