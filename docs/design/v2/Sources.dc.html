  <div style="position: absolute; left: 52px; right: 52px; top: 20px; height: 28px; display: flex; align-items: center; justify-content: space-between">
    <div style="display: flex; gap: 14px; align-items: center">
      <svg width="24" height="22" viewBox="0 0 24 24" fill="none" stroke="#2fd8ff" stroke-width="2" stroke-linecap="round" role="img" aria-label="Wi-Fi 已连接"><path d="M2 9a15 15 0 0 1 20 0"></path><path d="M5.5 12.5a10 10 0 0 1 13 0"></path><path d="M9 16a5 5 0 0 1 6 0"></path><path d="M12 19.5h.01"></path></svg>

    </div>
    <div role="img" aria-label="电量 96%" style="width: 44px; height: 20px; box-sizing: border-box; border: 1.5px solid #59f0a6; border-radius: 6px; position: relative; display: flex; align-items: center; justify-content: center">
      <div style="position: absolute; left: 2px; top: 2px; bottom: 2px; width: 34px; border-radius: 3px; background: rgba(89,240,166,0.35)"></div>
      <span style="position: relative; font-family: Montserrat, sans-serif; font-weight: 600; font-size: 12px">96</span>
    </div>
  </div>

  <div style="position: absolute; left: 44px; right: 44px; top: 58px; display: flex; flex-direction: column; gap: 8px">
    <div style="display: flex; align-items: center; gap: 8px">
      <a href="Settings.dc.html" aria-label="返回" style="width: 44px; height: 44px; margin-left: -10px; border-radius: 22px; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#9fb4be" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg></a>
      <span style="flex: 1; font-size: 22px; font-weight: 500">输入源</span>
    </div>
    <div role="radiogroup" aria-label="切换页样式" style="height: 48px; box-sizing: border-box; padding: 4px; display: flex; gap: 4px; border-radius: 16px; background: #05080c; box-shadow: inset 0 0 0 1px #15212b">
      <span role="radio" aria-checked="false" style="flex: 1; border-radius: 12px; display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 16px; color: #9fb4be">列表</span>
      <span role="radio" aria-checked="true" style="flex: 1; border-radius: 12px; display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 16px; color: {{accent}}; background: {{accentSoft}}; box-shadow: inset 0 0 0 1px {{accentLine}}">图标</span>
    </div>
    <a href="SourceEdit.dc.html" style="height: 58px; box-sizing: border-box; padding: 0 16px; display: flex; align-items: center; gap: 12px; border-radius: 16px; background: #070b10; box-shadow: inset 0 0 0 1px #15212b">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#9fb4be" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="9" width="17" height="7" rx="2.5"></rect><path d="M8 19h8"></path></svg>
      <span style="flex: 1; font-size: 18px">Mac mini</span>
      <span style="font-family: Montserrat, sans-serif; font-size: 11px; letter-spacing: 1px; color: #7f97a3">DISPLAYPORT</span>
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#3d5260" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg>
    </a>
    <a href="SourceEdit.dc.html" style="height: 58px; box-sizing: border-box; padding: 0 16px; display: flex; align-items: center; gap: 12px; border-radius: 16px; background: #070b10; box-shadow: inset 0 0 0 1px #15212b">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#9fb4be" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="5.5" width="14" height="9.5" rx="1.5"></rect><path d="M2.5 18.5h19"></path></svg>
      <span style="flex: 1; font-size: 18px">MacBook M1</span>
      <span style="font-family: Montserrat, sans-serif; font-size: 11px; letter-spacing: 1px; color: #7f97a3">HDMI</span>
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#3d5260" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg>
    </a>
    <a href="SourceEdit.dc.html" style="height: 58px; box-sizing: border-box; padding: 0 16px; display: flex; align-items: center; gap: 12px; border-radius: 16px; background: #070b10; box-shadow: inset 0 0 0 1px #15212b">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#9fb4be" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="5.5" width="14" height="9.5" rx="1.5"></rect><path d="M2.5 18.5h19"></path></svg>
      <span style="flex: 1; font-size: 18px">MacBook M4</span>
      <span style="font-family: Montserrat, sans-serif; font-size: 11px; letter-spacing: 1px; color: #7f97a3">USB-C</span>
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#3d5260" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg>
    </a>
    <div style="font-size: 13px; line-height: 1.6; color: #7f97a3">输入源由 App 提供。点一个，改它在设备上的名字和图标。</div>
  </div>
  <nav aria-label="主导航" style="position: absolute; left: 44px; right: 44px; bottom: 18px; height: 60px; box-sizing: border-box; padding: 4px; display: flex; gap: 4px; border-radius: 30px; background: #05080c; box-shadow: inset 0 0 0 1px #15212b">
    <a href="Main.dc.html" style="flex: 1; min-width: 0; border-radius: 26px; display: flex; align-items: center; justify-content: center; font-size: 17px; color: #9fb4be">切换</a>
    <a href="HomeRing.dc.html" style="flex: 1; min-width: 0; border-radius: 26px; display: flex; align-items: center; justify-content: center; font-size: 17px; color: #9fb4be">总览</a>
    <a href="Settings.dc.html" aria-current="page" style="flex: 1; min-width: 0; border-radius: 26px; display: flex; align-items: center; justify-content: center; font-size: 17px; color: {{accent}}; background: {{accentSoft}}; box-shadow: inset 0 0 0 1px {{accentLine}}">设置</a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#2fd8ff","options":["#2fd8ff","#5ee6b8","#ff9e4a"]},"$preview":{"width":480,"height":480}}'>
class Component extends DCLogic {
  renderVals() {
    const a = this.props.accent ?? '#2fd8ff';
    const rgb = [1, 3, 5].map((i) => parseInt(a.slice(i, i + 2), 16)).join(',');
    return { accent: a, accentSoft: 'rgba(' + rgb + ',0.12)', accentLine: 'rgba(' + rgb + ',0.6)', accentGlow: '0 0 20px rgba(' + rgb + ',0.32)' };
  }
}
</script>
</body>
</html>
