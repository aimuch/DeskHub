<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>完成以后可以撤销</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600&amp;family=Noto+Sans+SC:wght@400;500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:inherit;text-decoration:none}
</style>
</helmet>
<div style="width: 480px; height: 480px; position: relative; overflow: hidden; border-radius: 72px; background-color: #000000; background-image: linear-gradient(rgba(255,255,255,0.025) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,0.025) 1px, transparent 1px); background-size: 40px 40px; font-family: 'Noto Sans SC', 'Montserrat', sans-serif; color: #e8f3f7">

  <div style="position: absolute; left: 52px; right: 52px; top: 20px; height: 28px; display: flex; align-items: center; justify-content: space-between">
    <div style="display: flex; gap: 14px; align-items: center">
      <svg width="24" height="22" viewBox="0 0 24 24" fill="none" stroke="#2fd8ff" stroke-width="2" stroke-linecap="round" role="img" aria-label="Wi-Fi 已连接"><path d="M2 9a15 15 0 0 1 20 0"></path><path d="M5.5 12.5a10 10 0 0 1 13 0"></path><path d="M9 16a5 5 0 0 1 6 0"></path><path d="M12 19.5h.01"></path></svg>
      <svg width="24" height="22" viewBox="0 0 24 24" fill="none" stroke="#59f0a6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" role="img" aria-label="App 在线"><rect x="2.5" y="3.5" width="19" height="12.5" rx="2.5"></rect><path d="M8.5 20.5h7M12 16v4.5"></path></svg>
    </div>
    <div role="img" aria-label="电量 96%" style="width: 44px; height: 20px; box-sizing: border-box; border: 1.5px solid #59f0a6; border-radius: 6px; position: relative; display: flex; align-items: center; justify-content: center">
      <div style="position: absolute; left: 2px; top: 2px; bottom: 2px; width: 34px; border-radius: 3px; background: rgba(89,240,166,0.35)"></div>
      <span style="position: relative; font-family: Montserrat, sans-serif; font-weight: 600; font-size: 12px">96</span>
    </div>
  </div>

  <div style="position: absolute; left: 44px; right: 44px; top: 58px; height: 346px; overflow: hidden; display: flex; flex-direction: column; gap: 4px">
    <div style="display: flex; align-items: center; justify-content: space-between; height: 22px; padding: 0 6px">
      <span style="font-size: 14px; color: #9fb4be">未完成 9 条</span>
      <span style="font-size: 13px; color: #59f0a6">5 秒后告诉 Mac</span>
    </div>

    <div style="font-size: 13px; color: #ffb547; padding: 4px 6px 0">已过期 · 2</div>
    <div role="status" aria-label="已完成：交季度报告，5 秒内可以撤销" style="box-sizing: border-box; height: 56px; padding: 0 0 0 14px; border-radius: 14px; display: flex; align-items: center; gap: 12px; background: #070b10; box-shadow: inset 0 0 0 1.5px {{accentLine}}; position: relative; overflow: hidden">
      <span aria-hidden="true" style="width: 14px; height: 14px; border-radius: 7px; box-sizing: border-box; background: {{accent}}; flex: none; display: flex; align-items: center; justify-content: center"><svg width="10" height="10" viewBox="0 0 10 10" fill="none" stroke="#000000" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 5.2l2 2 4-4.4"></path></svg></span>
      <span style="flex: 1; min-width: 0; font-size: 17px; color: #7f97a3; text-decoration: line-through; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">交季度报告</span>
      <button type="button" style="all: unset; box-sizing: border-box; width: 96px; height: 56px; display: flex; align-items: center; justify-content: center; font-size: 17px; font-weight: 500; color: {{accent}}">撤销</button>
      <div aria-hidden="true" style="position: absolute; left: 0; bottom: 0; height: 3px; width: 62%; background: {{accent}}"></div>
    </div>
    <button type="button" style="all: unset; box-sizing: border-box; height: 44px; padding: 0 14px; border-radius: 14px; display: flex; align-items: center; gap: 12px; background: #070b10; box-shadow: inset 0 0 0 1px #15212b">
      <span aria-hidden="true" style="width: 14px; height: 14px; border-radius: 7px; box-sizing: border-box; border: 2px solid #ffb547; flex: none"></span>
      <span style="flex: 1; min-width: 0; font-size: 17px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">续费域名</span>
      <span style="font-size: 13px; color: #ffb547">11月8日</span>
    </button>

    <div style="font-size: 13px; color: {{accent}}; padding: 4px 6px 0">今天 · 3</div>
    <button type="button" aria-pressed="true" style="all: unset; box-sizing: border-box; padding: 9px 14px; border-radius: 14px; display: flex; align-items: flex-start; gap: 12px; background: #0d2c36; box-shadow: inset 0 0 0 1.5px {{accentLine}}">
      <span aria-hidden="true" style="width: 14px; height: 14px; margin-top: 5px; border-radius: 7px; box-sizing: border-box; border: 2px solid {{accent}}; background: {{accentSoft}}; flex: none"></span>
      <span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px">
        <span style="font-size: 17px; line-height: 1.35">回复设计评审的意见，附上新的截图和改过的流程</span>
        <span style="font-size: 13px; color: #9fb4be">工作 · 今天 14:30 · 长按可以操作</span>
      </span>
      <span style="flex: none; margin-top: 2px; padding: 1px 8px; border-radius: 9px; font-size: 12px; color: #000000; background: {{accent}}">今天</span>
    </button>
    <button type="button" style="all: unset; box-sizing: border-box; height: 44px; padding: 0 14px; border-radius: 14px; display: flex; align-items: center; gap: 12px; background: #070b10; box-shadow: inset 0 0 0 1px #15212b">
      <span aria-hidden="true" style="width: 14px; height: 14px; border-radius: 7px; box-sizing: border-box; border: 2px solid {{accent}}; flex: none"></span>
      <span style="flex: 1; min-width: 0; font-size: 17px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">给猫买粮</span>
      <span style="flex: none; padding: 1px 8px; border-radius: 9px; font-size: 12px; color: #000000; background: {{accent}}">今天</span>
    </button>
    <button type="button" style="all: unset; box-sizing: border-box; height: 44px; padding: 0 14px; border-radius: 14px; display: flex; align-items: center; gap: 12px; background: #070b10; box-shadow: inset 0 0 0 1px #15212b">
      <span aria-hidden="true" style="width: 14px; height: 14px; border-radius: 7px; box-sizing: border-box; border: 2px solid {{accent}}; flex: none"></span>
      <span style="flex: 1; min-width: 0; font-size: 17px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">取快递</span>
      <span style="flex: none; padding: 1px 8px; border-radius: 9px; font-size: 12px; color: #000000; background: {{accent}}">18:00</span>
    </button>

    <div style="font-size: 13px; color: #7f97a3; padding: 4px 6px 0">以后 · 4</div>
    <button type="button" style="all: unset; box-sizing: border-box; height: 44px; padding: 0 14px; border-radius: 14px; display: flex; align-items: center; gap: 12px; background: #070b10; box-shadow: inset 0 0 0 1px #15212b">
      <span aria-hidden="true" style="width: 14px; height: 14px; border-radius: 7px; box-sizing: border-box; border: 2px solid #4a5d67; flex: none"></span>
      <span style="flex: 1; min-width: 0; font-size: 17px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">预约体检</span>
      <span style="font-size: 13px; color: #7f97a3">明天</span>
    </button>
  </div>

  <div aria-hidden="true" style="position: absolute; left: 44px; right: 44px; top: 370px; height: 34px; background: linear-gradient(rgba(0,0,0,0), #000000 80%)"></div>
  <svg style="position: absolute; left: 230px; top: 386px" width="20" height="14" viewBox="0 0 20 14" fill="none" stroke="{{accent}}" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" role="img" aria-label="下面还有"><path d="M4 4l6 6 6-6"></path></svg>

  <nav aria-label="主导航" style="position: absolute; left: 44px; right: 44px; bottom: 18px; height: 60px; box-sizing: border-box; padding: 4px; display: flex; gap: 4px; border-radius: 30px; background: #05080c; box-shadow: inset 0 0 0 1px #15212b">
    <a href="Main.dc.html" style="flex: 1; min-width: 0; border-radius: 26px; display: flex; align-items: center; justify-content: center; font-size: 17px; color: #9fb4be">切源</a>
    <a href="HomeRing.dc.html" style="flex: 1; min-width: 0; border-radius: 26px; display: flex; align-items: center; justify-content: center; font-size: 17px; color: #9fb4be">总览</a>
    <a href="Todo.dc.html" aria-current="page" style="flex: 1; min-width: 0; border-radius: 26px; display: flex; align-items: center; justify-content: center; font-size: 17px; color: {{accent}}; background: {{accentSoft}}; box-shadow: inset 0 0 0 1px {{accentLine}}">待办</a>
    <a href="Settings.dc.html" style="flex: 1; min-width: 0; border-radius: 26px; display: flex; align-items: center; justify-content: center; font-size: 17px; color: #9fb4be">设置</a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#2fd8ff","options":["#2fd8ff","#5ee6b8","#ff9e4a"]},"$preview":{"width":480,"height":480}}'>
class Component extends DCLogic {
  renderVals() {
    const a = this.props.accent ?? '#2fd8ff';
    const rgb = [1, 3, 5].map((i) => parseInt(a.slice(i, i + 2), 16)).join(',');
    return { accent: a, accentSoft: 'rgba(' + rgb + ',0.12)', accentLine: 'rgba(' + rgb + ',0.6)', accentGlow: '0 0 20px rgba(' + rgb + ',0.32)' };
  }
}
</script>
</body>
</html>
