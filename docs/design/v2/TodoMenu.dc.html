<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>待办 长按</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600&amp;family=Noto+Sans+SC:wght@400;500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:inherit;text-decoration:none}
</style>
</helmet>
<div style="width: 480px; height: 480px; position: relative; overflow: hidden; border-radius: 72px; background-color: #000000; font-family: 'Noto Sans SC', 'Montserrat', sans-serif; color: #e8f3f7">

  <div aria-hidden="true" style="position: absolute; left: 44px; right: 44px; top: 58px; height: 346px; display: flex; flex-direction: column; gap: 4px; opacity: 0.22">
    <div style="height: 22px"></div>
    <div style="height: 18px"></div>
    <div style="height: 44px; border-radius: 14px; background: #070b10; box-shadow: inset 0 0 0 1px #15212b"></div>
    <div style="height: 44px; border-radius: 14px; background: #070b10; box-shadow: inset 0 0 0 1px #15212b"></div>
    <div style="height: 18px"></div>
    <div style="height: 70px; border-radius: 14px; background: #0d2c36"></div>
    <div style="height: 44px; border-radius: 14px; background: #070b10; box-shadow: inset 0 0 0 1px #15212b"></div>
  </div>

  <div role="dialog" aria-label="这条待办的操作" style="position: absolute; left: 56px; right: 56px; top: 64px; box-sizing: border-box; padding: 18px 18px 16px; border-radius: 28px; background: #0a1118; box-shadow: inset 0 0 0 1px #1f3140, 0 18px 48px rgba(0,0,0,0.6); display: flex; flex-direction: column; gap: 10px">
    <div style="display: flex; flex-direction: column; gap: 4px; padding: 0 4px 4px">
      <span style="font-size: 17px; line-height: 1.35">回复设计评审的意见，附上新的截图和改过的流程</span>
      <span style="font-size: 13px; color: #9fb4be">工作 · 今天 14:30</span>
    </div>
    <button type="button" style="all: unset; box-sizing: border-box; height: 52px; border-radius: 16px; display: flex; align-items: center; justify-content: center; gap: 10px; font-size: 18px; font-weight: 500; color: #000000; background: {{accent}}">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#000000" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg>完成
    </button>
    <button type="button" style="all: unset; box-sizing: border-box; height: 52px; border-radius: 16px; display: flex; align-items: center; justify-content: center; gap: 10px; font-size: 18px; color: #e8f3f7; background: #101b24; box-shadow: inset 0 0 0 1px #1f3140">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#e8f3f7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="8.5"></circle><path d="M12 7.5V12l3 2"></path></svg>推迟到明天
    </button>
    <button type="button" style="all: unset; box-sizing: border-box; height: 52px; border-radius: 16px; display: flex; align-items: center; justify-content: center; gap: 10px; font-size: 18px; color: #ffb547; background: #101b24; box-shadow: inset 0 0 0 1px #1f3140">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#ffb547" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4.5 7h15M9.5 7V4.5h5V7M6.5 7l1 12.5h9l1-12.5"></path></svg>删除…
    </button>
    <button type="button" style="all: unset; box-sizing: border-box; height: 44px; border-radius: 16px; display: flex; align-items: center; justify-content: center; font-size: 16px; color: #9fb4be">取消</button>
  </div>

  <div style="position: absolute; left: 0; right: 0; bottom: 34px; text-align: center; font-size: 13px; color: #7f97a3">点对话框外面也是取消</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#2fd8ff","options":["#2fd8ff","#5ee6b8","#ff9e4a"]},"$preview":{"width":480,"height":480}}'>
class Component extends DCLogic {
  renderVals() {
    const a = this.props.accent ?? '#2fd8ff';
    const rgb = [1, 3, 5].map((i) => parseInt(a.slice(i, i + 2), 16)).join(',');
    return { accent: a, accentSoft: 'rgba(' + rgb + ',0.12)', accentLine: 'rgba(' + rgb + ',0.6)' };
  }
}
</script>
</body>
</html>
