<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>设备 电池与电源</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="{{vars}} position: relative; width: 480px; height: 480px; overflow: hidden; background: linear-gradient(160deg, var(--bg), var(--bg2)); color: var(--ink); font-family: 'Noto Sans SC', 'PingFang SC', sans-serif;">

  <div style="position: absolute; left: 38px; top: 14px; display: flex; align-items: center; gap: 14px"><svg width="26" height="24" viewBox="0 0 24 24" fill="none" stroke-width="2.2" stroke-linecap="round" role="img" aria-label="Wi-Fi 已连接" style="flex: none; stroke: var(--wifi);"><path d="M2 9a15 15 0 0 1 20 0"></path><path d="M5.5 12.5a10 10 0 0 1 13 0"></path><path d="M9 16a5 5 0 0 1 6 0"></path><path d="M12 19.5h.01"></path></svg><svg width="26" height="24" viewBox="0 0 24 24" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" role="img" aria-label="电脑在线" style="flex: none; stroke: var(--agent)"><rect x="2.5" y="3.5" width="19" height="12.5" rx="2.5"></rect><path d="M8.5 20.5h7M12 16v4.5"></path></svg></div>
  <div style="position: absolute; right: 36px; top: 14px; display: flex; align-items: center; gap: 8px"><span style="width: 22px; height: 24px; display: flex"><svg width="22" height="24" viewBox="0 0 24 24" fill="none" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" role="img" aria-label="USB 供电" style="flex: none; stroke: var(--ink)"><path d="M12 18V4"></path><path d="M9.5 6.5 12 3.5l2.5 3"></path><path d="M12 14.5 7 12v-2.5"></path><circle cx="7" cy="8.2" r="1.3"></circle><path d="M12 12l5-2.5V8"></path><rect x="15.8" y="5.4" width="2.4" height="2.4" rx=".4"></rect><circle cx="12" cy="19.6" r="2"></circle></svg></span><div role="img" aria-label="电量 67%" style="position: relative; width: 51px; height: 24px; flex: none"><div style="position: absolute; left: 0; top: 1px; width: 46px; height: 22px; box-sizing: border-box; border: 2px solid var(--agent); border-radius: 7px"></div><div style="position: absolute; left: 3px; top: 4px; width: 27px; height: 16px; border-radius: 4px; background: color-mix(in srgb, var(--agent) 40%, transparent)"></div><div style="position: absolute; left: 2px; top: 1px; width: 42px; height: 22px; display: flex; align-items: center; justify-content: center; gap: 2px; font-size: 15px; font-weight: 500; line-height: 1; color: var(--ink)"><svg width="9" height="14" viewBox="0 0 14 22" role="img" aria-label="正在充电" style="flex: none"><path d="M8.6 1 1.4 12.6h5.2L5.6 21 12.6 9.2H7.4z" style="fill: var(--ink)"></path></svg>67</div><div style="position: absolute; left: 47px; top: 7.5px; width: 3px; height: 9px; border-radius: 1.5px; background: var(--agent)"></div></div></div>

  <div style="position: absolute; left: 24px; top: 62px; font-size: 26px; font-weight: 500; color: var(--power)">电池与电源</div>

  <div style="position: absolute; left: 24px; top: 104px; width: 432px; height: 48px; box-sizing: border-box; border-radius: 24px; border: 1px solid var(--edge); background: var(--card); display: flex; padding: 3px; gap: 3px">
    <sc-for list="{{segments}}" as="s" hint-placeholder-count="3">
      <div style="flex: 1 1 0; height: 40px; border-radius: 20px; display: flex; align-items: center; justify-content: center; font-size: 17px; font-weight: 500; background: {{s.bg}}; color: {{s.ink}}">{{s.label}}</div>
    </sc-for>
  </div>

  <sc-if value="{{isLevel}}" hint-placeholder-val="{{ true }}">
    <div style="position: absolute; left: 24px; top: 164px; width: 432px; height: 186px; box-sizing: border-box; border-radius: 24px; border: 1px solid var(--edge); background: var(--card)">
      <svg width="150" height="150" viewBox="0 0 130 130" style="position: absolute; left: 20px; top: 18px" role="img" aria-label="电量仪表 67%">
        <path d="M29.6 100.4 A50 50 0 1 1 100.4 100.4" fill="none" stroke-width="11" stroke-linecap="round" style="stroke: var(--track)"></path>
        <path d="M29.6 100.4 A50 50 0 1 1 100.9 30.2" fill="none" stroke-width="11" stroke-linecap="round" style="stroke: var(--agent)"></path>
      </svg>
      <div style="position: absolute; left: 20px; top: 74px; width: 150px; text-align: center; font-size: 34px; font-weight: 500">67%</div>
      <div style="position: absolute; left: 196px; top: 34px; right: 20px">
        <div style="font-size: 26px; font-weight: 500">电量 67%</div>
        <div style="margin-top: 6px; display: inline-flex; padding: 3px 12px; border-radius: 999px; font-size: 16px; font-weight: 500; color: var(--agent); background: rgba(91,227,140,0.14); border: 1px solid rgba(91,227,140,0.5)">充电中</div>
        <div style="margin-top: 14px; font-size: 16px; color: var(--muted)">PMIC 读数，未验证</div>
      </div>
    </div>
    <div style="position: absolute; left: 24px; top: 360px; width: 432px; height: 40px; box-sizing: border-box; padding: 0 18px; border-radius: 20px; border: 1px solid var(--edge); background: var(--card); display: flex; align-items: center; justify-content: space-between">
      <span style="font-size: 16px">充电保护：未开启</span>
      
    </div>
  </sc-if>

  <sc-if value="{{isReadings}}" hint-placeholder-val="{{ false }}">
    <div style="position: absolute; left: 24px; top: 164px; width: 432px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
      <sc-for list="{{readings}}" as="r" hint-placeholder-count="4">
        <div style="height: 112px; box-sizing: border-box; padding: 14px 18px; border-radius: 22px; border: 1px solid var(--edge); background: var(--card)">
          <div style="font-size: 16px; color: var(--muted)">{{r.label}}</div>
          <div style="margin-top: 4px; font-size: 32px; font-weight: 500; color: {{r.color}}">{{r.value}}</div>
          <div style="margin-top: 2px; font-size: 14px; color: var(--muted)">{{r.note}}</div>
        </div>
      </sc-for>
    </div>
  </sc-if>

  <sc-if value="{{isProtect}}" hint-placeholder-val="{{ false }}">
    <div style="position: absolute; left: 24px; top: 164px; width: 432px; height: 190px; box-sizing: border-box; padding: 20px 22px; border-radius: 24px; border: 1px solid var(--edge); background: var(--card)">
      <div style="display: flex; align-items: center; justify-content: space-between">
        <div style="display: flex; align-items: center; gap: 10px"><span style="font-size: 22px; font-weight: 500">充电保护</span></div>
        <span style="font-size: 18px; color: var(--muted)">未开启</span>
      </div>
      <div style="margin-top: 14px; font-size: 17px; line-height: 1.7; color: var(--muted)">达到上限后停止充电，低于回充线再恢复。<br>读不到电量或温度过高时，恢复正常充电。</div>
      <div style="margin-top: 16px; height: 52px; box-sizing: border-box; border-radius: 26px; border: 1.5px solid var(--accent); background: var(--sel); display: flex; align-items: center; justify-content: center; font-size: 19px; font-weight: 500; color: var(--accent)">开启…</div>
    </div>
  </sc-if>

  <div style="position: absolute; left: 24px; top: 408px; width: 432px; height: 64px; box-sizing: border-box; border-radius: 32px; border: 1px solid var(--edge); background: var(--card); display: flex; padding: 3px; gap: 3px">
    <sc-for list="{{tabs}}" as="t" hint-placeholder-count="4">
      <div style="flex: 1 1 0; height: 56px; border-radius: 28px; display: flex; align-items: center; justify-content: center; font-size: 18px; font-weight: 500; background: {{t.bg}}; color: {{t.ink}}">{{t.label}}</div>
    </sc-for>
  </div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","default":"mint","options":["mint","ocean","amber"]},"view":{"editor":"enum","default":"level","options":["level","readings","protect"]},"$preview":{"width":480,"height":480}}'>
class Component extends DCLogic {
  renderVals() {
    const T = {
      mint: '--bg:#03100e;--bg2:#082520;--card:#0b1d1a;--edge:#1b3d37;--ink:#e6f7f2;--muted:#8aa8a1;--accent:#5ee6b8;--sel:#103a30;--track:#0f2622;--wifi:#4fd1ff;--agent:#5be38c;--power:#f2b544;--time:#c38bff;',
      ocean: '--bg:#03131c;--bg2:#062a3a;--card:#0a2130;--edge:#173c50;--ink:#e6f6ff;--muted:#86a9bb;--accent:#4fc3f7;--sel:#0f3a52;--track:#0f2938;--wifi:#4fc3f7;--agent:#4de0b6;--power:#ffc857;--time:#9fa8ff;',
      amber: '--bg:#120c08;--bg2:#24150a;--card:#1e1510;--edge:#3a2a1f;--ink:#f5e9dc;--muted:#b09a85;--accent:#ff9e4a;--sel:#3a2412;--track:#2a1f17;--wifi:#45c8ea;--agent:#8ddf6c;--power:#ffb347;--time:#db8ff2;'
    };
    const names = ['总览', '动作', '电脑', '设置'];
    const active = 3;
    const view = this.props.view || 'level';
    const segs = [['level', '电量'], ['readings', '读数'], ['protect', '保护']];
    return {
      vars: T[this.props.theme] || T.mint,
      isLevel: view === 'level',
      isReadings: view === 'readings',
      isProtect: view === 'protect',
      segments: segs.map(([id, label]) => ({
        label,
        bg: id === view ? 'var(--sel)' : 'transparent',
        ink: id === view ? 'var(--accent)' : 'var(--muted)'
      })),
      tabs: names.map((label, i) => ({
        label,
        bg: i === active ? 'var(--sel)' : 'transparent',
        ink: i === active ? 'var(--accent)' : 'var(--muted)'
      })),
      readings: [
        { label: '电池电压', value: '4.12 V', note: '合理范围 2.5 到 4.6 V', color: 'var(--ink)' },
        { label: 'USB 电压', value: '5.03 V', note: '合理范围 3.0 到 6.5 V', color: 'var(--ink)' },
        { label: '充电状态', value: '充电中', note: '电源芯片报告', color: 'var(--agent)' },
        { label: '芯片温度', value: '42.0 度', note: '电源芯片，不是电池', color: 'var(--ink)' }
      ]
    };
  }
}
</script>
</body>
</html>
