<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>设备 外观</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="{{vars}} position: relative; width: 480px; height: 480px; overflow: hidden; background: linear-gradient(160deg, var(--bg), var(--bg2)); color: var(--ink); font-family: 'Noto Sans SC', 'PingFang SC', sans-serif;">

  <div style="position: absolute; left: 38px; top: 14px; display: flex; align-items: center; gap: 14px"><svg width="26" height="24" viewBox="0 0 24 24" fill="none" stroke-width="2.2" stroke-linecap="round" role="img" aria-label="Wi-Fi 已连接" style="flex: none; stroke: var(--wifi);"><path d="M2 9a15 15 0 0 1 20 0"></path><path d="M5.5 12.5a10 10 0 0 1 13 0"></path><path d="M9 16a5 5 0 0 1 6 0"></path><path d="M12 19.5h.01"></path></svg><svg width="26" height="24" viewBox="0 0 24 24" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" role="img" aria-label="电脑在线" style="flex: none; stroke: var(--agent)"><rect x="2.5" y="3.5" width="19" height="12.5" rx="2.5"></rect><path d="M8.5 20.5h7M12 16v4.5"></path></svg></div>
  <div style="position: absolute; right: 36px; top: 14px; display: flex; align-items: center; gap: 8px"><span style="width: 22px; height: 24px; display: flex"><svg width="22" height="24" viewBox="0 0 24 24" fill="none" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" role="img" aria-label="USB 供电" style="flex: none; stroke: var(--ink)"><path d="M12 18V4"></path><path d="M9.5 6.5 12 3.5l2.5 3"></path><path d="M12 14.5 7 12v-2.5"></path><circle cx="7" cy="8.2" r="1.3"></circle><path d="M12 12l5-2.5V8"></path><rect x="15.8" y="5.4" width="2.4" height="2.4" rx=".4"></rect><circle cx="12" cy="19.6" r="2"></circle></svg></span><span style="width: 14px; height: 22px; display: flex"><svg width="14" height="22" viewBox="0 0 14 22" role="img" aria-label="正在充电" style="flex: none"><path d="M8.6 1 1.4 12.6h5.2L5.6 21 12.6 9.2H7.4z" style="fill: var(--agent)"></path></svg></span><div role="img" aria-label="电量 67%" style="position: relative; width: 51px; height: 24px; flex: none"><div style="position: absolute; left: 0; top: 1px; width: 46px; height: 22px; box-sizing: border-box; border: 2px solid var(--agent); border-radius: 7px"></div><div style="position: absolute; left: 3px; top: 4px; width: 27px; height: 16px; border-radius: 4px; background: color-mix(in srgb, var(--agent) 40%, transparent)"></div><div style="position: absolute; left: 2px; top: 1px; width: 42px; height: 22px; display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 500; line-height: 1; color: var(--ink)">67</div><div style="position: absolute; left: 47px; top: 7.5px; width: 3px; height: 9px; border-radius: 1.5px; background: var(--agent)"></div></div></div>

  <div style="position: absolute; left: 24px; top: 62px; font-size: 26px; font-weight: 500; color: var(--time)">外观</div>
  <div style="position: absolute; right: 24px; top: 72px; font-size: 13px; color: var(--muted)">长按按键 10 秒，恢复默认</div>

  <div style="position: absolute; left: 24px; top: 100px; font-size: 14px; color: var(--muted)">主题</div>
  <div style="position: absolute; left: 24px; top: 122px; width: 432px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
    <sc-for list="{{themes}}" as="t" hint-placeholder-count="3">
      <div style="height: 52px; box-sizing: border-box; border-radius: 16px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; background: {{t.bg}}; border: {{t.border}}">
        <span style="width: 56px; height: 10px; border-radius: 5px; background: {{t.swatch}}"></span>
        <span style="font-size: 15px; font-weight: 500; color: {{t.ink}}">{{t.label}}</span>
      </div>
    </sc-for>
  </div>

  <div style="position: absolute; left: 24px; top: 184px; font-size: 14px; color: var(--muted)">强调色</div>
  <div style="position: absolute; left: 24px; top: 206px; width: 432px; display: flex; justify-content: space-between">
    <sc-for list="{{accents}}" as="a" hint-placeholder-count="6">
      <span style="width: 44px; height: 44px; box-sizing: border-box; border-radius: 50%; background: {{a.color}}; border: {{a.border}}; box-shadow: {{a.glow}}"></span>
    </sc-for>
  </div>

  <div style="position: absolute; left: 24px; top: 262px; font-size: 14px; color: var(--muted)">语言</div>
  <div style="position: absolute; left: 24px; top: 284px; width: 432px; height: 46px; box-sizing: border-box; border-radius: 23px; border: 1px solid var(--edge); background: var(--card); display: flex; padding: 3px; gap: 3px">
    <sc-for list="{{languages}}" as="l" hint-placeholder-count="2">
      <div style="flex: 1 1 0; height: 38px; border-radius: 19px; display: flex; align-items: center; justify-content: center; font-size: 17px; font-weight: 500; background: {{l.bg}}; color: {{l.ink}}">{{l.label}}</div>
    </sc-for>
  </div>

  <div style="position: absolute; left: 24px; top: 338px; font-size: 14px; color: var(--muted)">文字大小</div>
  <div style="position: absolute; left: 24px; top: 360px; width: 432px; height: 42px; box-sizing: border-box; border-radius: 21px; border: 1px solid var(--edge); background: var(--card); display: flex; padding: 3px; gap: 3px">
    <sc-for list="{{sizes}}" as="z" hint-placeholder-count="3">
      <div style="flex: 1 1 0; height: 34px; border-radius: 17px; display: flex; align-items: center; justify-content: center; font-weight: 500; font-size: {{z.size}}; background: {{z.bg}}; color: {{z.ink}}">{{z.label}}</div>
    </sc-for>
  </div>

  <div style="position: absolute; left: 24px; top: 408px; width: 432px; height: 64px; box-sizing: border-box; border-radius: 32px; border: 1px solid var(--edge); background: var(--card); display: flex; padding: 3px; gap: 3px">
    <sc-for list="{{tabs}}" as="t" hint-placeholder-count="4">
      <div style="flex: 1 1 0; height: 56px; border-radius: 28px; display: flex; align-items: center; justify-content: center; font-size: 18px; font-weight: 500; background: {{t.bg}}; color: {{t.ink}}">{{t.label}}</div>
    </sc-for>
  </div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","default":"mint","options":["mint","ocean","amber"]},"$preview":{"width":480,"height":480}}'>
class Component extends DCLogic {
  renderVals() {
    const T = {
      mint: '--bg:#03100e;--bg2:#082520;--card:#0b1d1a;--edge:#1b3d37;--ink:#e6f7f2;--muted:#8aa8a1;--accent:#5ee6b8;--sel:#103a30;--track:#0f2622;--wifi:#4fd1ff;--agent:#5be38c;--power:#f2b544;--time:#c38bff;',
      ocean: '--bg:#03131c;--bg2:#062a3a;--card:#0a2130;--edge:#173c50;--ink:#e6f6ff;--muted:#86a9bb;--accent:#4fc3f7;--sel:#0f3a52;--track:#0f2938;--wifi:#4fc3f7;--agent:#4de0b6;--power:#ffc857;--time:#9fa8ff;',
      amber: '--bg:#120c08;--bg2:#24150a;--card:#1e1510;--edge:#3a2a1f;--ink:#f5e9dc;--muted:#b09a85;--accent:#ff9e4a;--sel:#3a2412;--track:#2a1f17;--wifi:#45c8ea;--agent:#8ddf6c;--power:#ffb347;--time:#db8ff2;'
    };
    const names = ['总览', '动作', '电脑', '设置'];
    const active = 3;
    const theme = this.props.theme || 'mint';
    const defs = [
      { id: 'mint', label: '薄荷夜色', swatch: 'linear-gradient(90deg,#03100e,#5ee6b8)' },
      { id: 'ocean', label: '深海蓝', swatch: 'linear-gradient(90deg,#03131c,#4fc3f7)' },
      { id: 'amber', label: '暖橙', swatch: 'linear-gradient(90deg,#120c08,#ff9e4a)' }
    ];
    const colors = ['#5ee6b8', '#4fc3f7', '#ff9e4a', '#c38bff', '#ff8fab', '#b8e65e'];
    const choose = (on, list) => list.map((label, i) => ({
      label,
      bg: i === on ? 'var(--sel)' : 'transparent',
      ink: i === on ? 'var(--accent)' : 'var(--muted)'
    }));
    return {
      vars: T[theme] || T.mint,
      tabs: names.map((label, i) => ({
        label,
        bg: i === active ? 'var(--sel)' : 'transparent',
        ink: i === active ? 'var(--accent)' : 'var(--muted)'
      })),
      themes: defs.map((d) => ({
        label: d.label,
        swatch: d.swatch,
        bg: d.id === theme ? 'var(--sel)' : 'var(--card)',
        ink: d.id === theme ? 'var(--accent)' : 'var(--ink)',
        border: d.id === theme ? '1.5px solid var(--accent)' : '1px solid var(--edge)'
      })),
      accents: colors.map((c, i) => ({
        color: c,
        border: i === 0 ? '3px solid var(--ink)' : '3px solid transparent',
        glow: i === 0 ? '0 0 14px ' + c : 'none'
      })),
      languages: choose(0, ['简体中文', 'English']),
      sizes: choose(1, ['小', '标准', '大']).map((s, i) => ({ ...s, size: ['15px', '18px', '22px'][i] }))
    };
  }
}
</script>
</body>
</html>
