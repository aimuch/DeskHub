<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>设备 配网页</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="{{vars}} position: relative; width: 480px; height: 480px; overflow: hidden; background: linear-gradient(160deg, var(--bg), var(--bg2)); color: var(--ink); font-family: 'Noto Sans SC', 'PingFang SC', sans-serif;">

  <div style="position: absolute; left: 24px; top: 28px; width: 432px; text-align: center">
    <div style="font-size: 28px; font-weight: 500; color: var(--accent)">配网页已开启</div>
    <div style="margin-top: 6px; font-size: 16px; color: var(--muted)">人在设备旁才会开启 · 5 分钟后自动关闭</div>
  </div>

  <div style="position: absolute; left: 24px; top: 112px; width: 432px; height: 138px; box-sizing: border-box; border-radius: 28px; border: 1.5px solid var(--accent); background: var(--sel); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px">
    <div style="font-size: 16px; color: var(--muted)">一次性验证码</div>
    <div style="font-size: 62px; font-weight: 500; line-height: 1.05; letter-spacing: 12px; padding-left: 12px; font-variant-numeric: tabular-nums">{{code}}</div>
  </div>

  <div style="position: absolute; left: 24px; top: 268px; width: 432px; display: flex; align-items: center; justify-content: center; gap: 10px; font-size: 18px">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" aria-hidden="true" style="stroke: var(--wifi)"><path d="M2 9a15 15 0 0 1 20 0"></path><path d="M5.5 12.5a10 10 0 0 1 13 0"></path><path d="M9 16a5 5 0 0 1 6 0"></path><path d="M12 19.5h.01"></path></svg>
    <span style="color: var(--muted)">热点</span><span style="font-weight: 500">DeskHub-C598</span>
  </div>
  <div style="position: absolute; left: 40px; top: 306px; width: 400px; text-align: center; font-size: 16px; line-height: 1.6; color: var(--muted)">用手机连接这个热点，打开配网页，输入上面的验证码。</div>

  <div style="position: absolute; left: 24px; top: 366px; width: 432px">
    <div style="display: flex; justify-content: space-between; font-size: 14px; color: var(--muted)"><span>剩余时间</span><span>04:32</span></div>
    <div style="margin-top: 6px; height: 8px; border-radius: 999px; background: var(--track); overflow: hidden"><div style="width: 90%; height: 8px; border-radius: 999px; background: var(--accent)"></div></div>
  </div>

  <div style="position: absolute; left: 24px; top: 408px; width: 432px; height: 56px; box-sizing: border-box; border-radius: 28px; border: 1px solid var(--edge); background: var(--card); display: flex; align-items: center; justify-content: center; font-size: 19px; font-weight: 500">取消配网</div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","default":"mint","options":["mint","ocean","amber"]},"$preview":{"width":480,"height":480}}'>
class Component extends DCLogic {
  renderVals() {
    const T = {
      mint: '--bg:#03100e;--bg2:#082520;--card:#0b1d1a;--edge:#1b3d37;--ink:#e6f7f2;--muted:#8aa8a1;--accent:#5ee6b8;--sel:#103a30;--track:#0f2622;--wifi:#4fd1ff;--agent:#5be38c;--power:#f2b544;--time:#c38bff;',
      ocean: '--bg:#03131c;--bg2:#062a3a;--card:#0a2130;--edge:#173c50;--ink:#e6f6ff;--muted:#86a9bb;--accent:#4fc3f7;--sel:#0f3a52;--track:#0f2938;--wifi:#4fc3f7;--agent:#4de0b6;--power:#ffc857;--time:#9fa8ff;',
      amber: '--bg:#120c08;--bg2:#24150a;--card:#1e1510;--edge:#3a2a1f;--ink:#f5e9dc;--muted:#b09a85;--accent:#ff9e4a;--sel:#3a2412;--track:#2a1f17;--wifi:#45c8ea;--agent:#8ddf6c;--power:#ffb347;--time:#db8ff2;'
    };
    return { vars: T[this.props.theme] || T.mint, code: '482917' };
  }
}
</script>
</body>
</html>
