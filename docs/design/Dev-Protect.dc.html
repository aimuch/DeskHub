<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>设备 充电保护</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="{{vars}} position: relative; width: 480px; height: 480px; overflow: hidden; background: linear-gradient(160deg, var(--bg), var(--bg2)); color: var(--ink); font-family: 'Noto Sans SC', 'PingFang SC', sans-serif;">

  <div style="position: absolute; left: 0; top: 0; width: 480px; height: 480px; opacity: 0.4">
    <div style="position: absolute; left: 24px; top: 66px; font-size: 26px; font-weight: 500; color: var(--power)">电池与电源</div>
    <div style="position: absolute; left: 24px; top: 106px; width: 432px; height: 150px; box-sizing: border-box; border-radius: 24px; border: 1px solid var(--edge); background: var(--card)"></div>
    <div style="position: absolute; left: 24px; top: 268px; width: 210px; height: 58px; box-sizing: border-box; border-radius: 20px; border: 1px solid var(--edge); background: var(--card)"></div>
    <div style="position: absolute; left: 246px; top: 268px; width: 210px; height: 58px; box-sizing: border-box; border-radius: 20px; border: 1px solid var(--edge); background: var(--card)"></div>
  </div>
  <div style="position: absolute; left: 0; top: 0; width: 480px; height: 480px; background: rgba(0, 0, 0, 0.55)"></div>

  <div style="position: absolute; left: 36px; top: 54px; width: 408px; box-sizing: border-box; padding: 24px 24px 22px; border-radius: 28px; border: 1px solid var(--edge); background: var(--card); box-shadow: 0 12px 40px rgba(0,0,0,0.5)">
    <div style="display: flex; align-items: center; gap: 12px">
      <span style="font-size: 26px; font-weight: 500">开启充电保护？</span>
      <span style="padding: 2px 10px; border-radius: 999px; font-size: 14px; font-weight: 500; color: var(--power); background: rgba(242,181,68,0.14); border: 1px solid rgba(242,181,68,0.5)">实验</span>
    </div>
    <div style="margin-top: 14px; font-size: 17px; line-height: 1.65; color: var(--muted)">电量到上限就停止充电，降到回充点再充。<br>读不到电量时，会恢复正常充电。</div>

    <div style="margin-top: 18px; font-size: 15px; color: var(--muted)">上限</div>
    <div style="margin-top: 8px; display: flex; gap: 10px">
      <sc-for list="{{limits}}" as="l" hint-placeholder-count="2">
        <div style="flex: 1 1 0; height: 56px; box-sizing: border-box; border-radius: 18px; display: flex; flex-direction: column; align-items: center; justify-content: center; background: {{l.bg}}; border: {{l.border}}">
          <span style="font-size: 22px; font-weight: 500; color: {{l.ink}}">{{l.label}}</span><span style="font-size: 13px; color: var(--muted)">{{l.sub}}</span>
        </div>
      </sc-for>
    </div>

    <div style="margin-top: 22px; display: flex; gap: 12px">
      <div style="flex: 1 1 0; height: 56px; box-sizing: border-box; border-radius: 28px; border: 1px solid var(--edge); background: var(--card); display: flex; align-items: center; justify-content: center; font-size: 19px; font-weight: 500">取消</div>
      <div style="flex: 1 1 0; height: 56px; box-sizing: border-box; border-radius: 28px; border: 1.5px solid var(--accent); background: var(--sel); display: flex; align-items: center; justify-content: center; font-size: 19px; font-weight: 500; color: var(--accent)">开启</div>
    </div>
  </div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","default":"mint","options":["mint","ocean","amber"]},"$preview":{"width":480,"height":480}}'>
class Component extends DCLogic {
  renderVals() {
    const T = {
      mint: '--bg:#03100e;--bg2:#082520;--card:#0b1d1a;--edge:#1b3d37;--ink:#e6f7f2;--muted:#8aa8a1;--accent:#5ee6b8;--sel:#103a30;--track:#0f2622;--wifi:#4fd1ff;--agent:#5be38c;--power:#f2b544;--time:#c38bff;',
      ocean: '--bg:#03131c;--bg2:#062a3a;--card:#0a2130;--edge:#173c50;--ink:#e6f6ff;--muted:#86a9bb;--accent:#4fc3f7;--sel:#0f3a52;--track:#0f2938;--wifi:#4fc3f7;--agent:#4de0b6;--power:#ffc857;--time:#9fa8ff;',
      amber: '--bg:#120c08;--bg2:#24150a;--card:#1e1510;--edge:#3a2a1f;--ink:#f5e9dc;--muted:#b09a85;--accent:#ff9e4a;--sel:#3a2412;--track:#2a1f17;--wifi:#45c8ea;--agent:#8ddf6c;--power:#ffb347;--time:#db8ff2;'
    };
    const raw = [
      { label: '80%', sub: '75% 回充', on: true },
      { label: '90%', sub: '85% 回充', on: false }
    ];
    return {
      vars: T[this.props.theme] || T.mint,
      limits: raw.map((l) => ({
        label: l.label,
        sub: l.sub,
        bg: l.on ? 'var(--sel)' : 'var(--track)',
        border: l.on ? '1.5px solid var(--accent)' : '1px solid var(--edge)',
        ink: l.on ? 'var(--accent)' : 'var(--ink)'
      }))
    };
  }
}
</script>
</body>
</html>
