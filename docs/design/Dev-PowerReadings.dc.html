<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>设备 电池与电源 读数</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 480px; height: 480px; overflow: hidden">
  <dc-import name="Dev-Power" view="readings" theme="{{theme}}" hint-size="480px,480px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","default":"mint","options":["mint","ocean","amber"]},"$preview":{"width":480,"height":480}}'>
class Component extends DCLogic {
  renderVals() {
    return { theme: this.props.theme || 'mint' };
  }
}
</script>
</body>
</html>
